<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>StudyBuddy · 日志笔记</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b6cff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StudyBuddy">
<meta name="description" content="轻量日志笔记：随手记，用 #标签 分类，支持搜索、导出、离线使用。">
<!-- 单文件应用：图标与 manifest 全部内联，不依赖任何外部文件。
     外链 manifest.webmanifest / icons/*.png 在单文件部署下必然 404，
     既污染控制台、也让「添加到主屏」拿不到图标。这里改成一个内联 SVG 图标，
     manifest 由脚本用 Blob 动态生成后再挂上去（见 initManifest()）。 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%235b6cff'/%3E%3Cpath d='M20 44V20h6l6 12 6-12h6v24h-5V29l-5 10h-4l-5-10v15z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%235b6cff'/%3E%3Cpath d='M56 124V56h17l17 34 17-34h17v68h-14V82l-14 28h-12l-14-28v42z' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f5f9; --card:#ffffff; --card-2:#fafbfe;
  --text:#1b1f2a; --muted:#676f85; --line:#e6e8f0;
  --brand:#5b6cff; --brand-2:#8a5cff; --brand-soft:#eaecff;
  --danger:#e5484d; --ok:#2f9e6e;
  --shadow:0 1px 2px rgba(20,24,40,.05), 0 6px 18px -8px rgba(20,24,40,.16);
  --radius:16px;
}
html[data-theme="dark"]{
  --bg:#101218; --card:#191c24; --card-2:#1f232d;
  --text:#e8eaf2; --muted:#8b93a8; --line:#2a2f3c;
  --brand:#7c8bff; --brand-2:#a77cff; --brand-soft:#232744;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -10px rgba(0,0,0,.6);
}
/* 全屏倒计时主题：默认深色沉浸，浅色模式下自动切换 */
:root{
  --pf-bg:radial-gradient(120% 90% at 50% 0%, #1b1f3a 0%, #0d0f18 62%, #08090e 100%);
  --pf-text:#ffffff;
  --pf-muted:#a9b1d0;
  --pf-line:rgba(255,255,255,.18);
  --pf-btn-bg:rgba(255,255,255,.07);
  --pf-ring-bg:rgba(255,255,255,.13);
  --pf-num-shadow:0 6px 40px rgba(91,108,255,.45);
}
html[data-theme="light"]{
  --pf-bg:radial-gradient(120% 90% at 50% 0%, #ffffff 0%, #eef0f8 58%, #e2e5f2 100%);
  --pf-text:#151a28;
  --pf-muted:#5c6480;
  --pf-line:rgba(21,26,40,.14);
  --pf-btn-bg:rgba(255,255,255,.72);
  --pf-ring-bg:rgba(21,26,40,.1);
  --pf-num-shadow:0 4px 30px rgba(91,108,255,.28);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:15px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  overscroll-behavior-y:none;
}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:720px;margin:0 auto}

/* ---------- 顶栏 ---------- */
header{
  padding:calc(env(safe-area-inset-top) + 14px) 16px 10px;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  color:#fff;border-radius:0 0 22px 22px;box-shadow:var(--shadow);
  position:relative;z-index:3;
}
.bar{display:flex;align-items:center;gap:10px}
h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.3px;flex:1}
h1 small{display:block;font-size:11px;font-weight:400;opacity:.85;letter-spacing:0}
.icon-btn{
  width:36px;height:36px;border:0;border-radius:12px;cursor:pointer;
  background:rgba(255,255,255,.18);color:#fff;font-size:16px;line-height:1;
  display:flex;align-items:center;justify-content:center;
}
.icon-btn:active{transform:scale(.94)}
.stat{margin-top:10px;font-size:12px;opacity:.92;display:flex;gap:14px;flex-wrap:wrap}
.stat b{font-size:14px}

/* ---------- 搜索 / 标签 ---------- */
.toolbar{padding:12px 16px 4px;background:var(--bg)}
.search{
  display:flex;align-items:center;gap:8px;background:var(--card);
  border:1px solid var(--line);border-radius:12px;padding:0 12px;box-shadow:var(--shadow);
}
.search svg{flex:0 0 16px;opacity:.45}
.search input{
  flex:1;border:0;background:transparent;color:var(--text);
  font-size:16px;padding:11px 0;outline:none;min-width:0;
}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--muted);
  padding:5px 12px;border-radius:999px;font-size:12.5px;cursor:pointer;white-space:nowrap;
}
.chip.on{background:var(--brand-soft);border-color:transparent;color:var(--brand);font-weight:600}

/* ---------- 列表 ---------- */
main{flex:1;overflow-y:auto;padding:6px 16px 18px;-webkit-overflow-scrolling:touch}
.day{
  display:flex;align-items:center;gap:10px;
  margin:16px 0 8px;font-size:12.5px;color:var(--muted);font-weight:600;
}
.day::after{content:"";flex:1;height:1px;background:var(--line)}
.note{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow);position:relative;
  animation:in .18s ease-out;
}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.note .txt{white-space:pre-wrap;word-break:break-word;margin:0 0 8px}
.note .txt:last-child{margin-bottom:0}
.note .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tag{
  font-size:11.5px;color:var(--brand);background:var(--brand-soft);
  border-radius:999px;padding:2px 9px;border:0;cursor:pointer;font-family:inherit;
}
.note .foot{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:11.5px}
.note .foot .sp{flex:1}
.link{border:0;background:none;color:var(--muted);font-size:11.5px;cursor:pointer;padding:2px 4px;font-family:inherit}
.link:hover{color:var(--brand)}
.empty{text-align:center;color:var(--muted);padding:56px 20px;font-size:13.5px;line-height:2}
.empty b{display:block;font-size:15px;color:var(--text);margin-bottom:6px}

/* ---------- 底部输入 ---------- */
footer{
  padding:9px 16px calc(env(safe-area-inset-bottom) + 10px);
  background:var(--card);border-top:1px solid var(--line);
  display:flex;flex-direction:column;align-items:stretch;
}
.crow{display:flex;gap:10px;align-items:flex-end}
#composer{
  flex:1;resize:none;border:1px solid var(--line);border-radius:14px;
  background:var(--card-2);color:var(--text);padding:11px 13px;
  font:inherit;font-size:16px;line-height:1.5;outline:none;
  max-height:132px;min-height:46px;
}
#composer:focus{border-color:var(--brand)}
#send{
  width:52px;height:46px;border:0;border-radius:14px;cursor:pointer;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;
  font-size:15px;font-weight:600;flex:0 0 auto;
}
#send:active{transform:scale(.96)}
#send:disabled{opacity:.45}

/* ---------- 弹层 ---------- */
dialog{
  border:0;border-radius:18px;padding:0;width:min(92vw,420px);
  max-height:88vh;max-height:88dvh;overflow-y:auto;
  background:var(--card);color:var(--text);box-shadow:0 20px 60px -12px rgba(0,0,0,.45);
}
dialog::backdrop{background:rgba(12,14,22,.5);backdrop-filter:blur(2px)}
.dlg-body{padding:18px 18px 6px}
.dlg-body h3{margin:0 0 12px;font-size:16px}
.dlg-body label{display:block;font-size:12.5px;color:var(--muted);margin:0 0 6px}
.dlg-body textarea,.dlg-body input[type=text]{
  width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card-2);
  color:var(--text);padding:10px 12px;font:inherit;font-size:16px;outline:none;resize:vertical;
}
.dlg-body textarea{min-height:130px}
.dlg-actions{display:flex;gap:8px;padding:14px 18px 18px}
.dlg-actions-col{flex-direction:column}
.btn{
  flex:1;border:1px solid var(--line);background:var(--card-2);color:var(--text);
  border-radius:12px;padding:11px;font:inherit;font-size:14px;cursor:pointer;
}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent;font-weight:600}
.btn.danger{color:var(--danger)}
.menu-row{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  border:0;border-bottom:1px solid var(--line);background:none;color:var(--text);
  padding:14px 18px;font:inherit;font-size:14.5px;cursor:pointer;
}
.menu-row:last-child{border-bottom:0;border-radius:0 0 18px 18px}
.menu-row .em{width:20px;text-align:center}
.menu-row small{display:block;color:var(--muted);font-size:11.5px}
.toast{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);
  transform:translateX(-50%) translateY(8px);
  background:rgba(24,28,40,.94);color:#fff;padding:9px 16px;border-radius:999px;
  font-size:13px;opacity:0;pointer-events:none;transition:.22s;z-index:200;
}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast.undobox{
  display:flex;align-items:center;gap:12px;pointer-events:auto;
  bottom:calc(env(safe-area-inset-bottom) + 148px);padding:8px 8px 8px 16px;max-width:86vw;
}
.toast.undobox button{
  border:0;border-radius:999px;background:rgba(255,255,255,.24);color:#fff;
  padding:5px 14px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;flex:0 0 auto;
}
.toast.undobox span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loadmore{
  display:block;width:100%;margin:6px 0 14px;padding:11px;
  border:1px solid var(--line);border-radius:12px;background:var(--card);
  color:var(--muted);font:inherit;font-size:13px;cursor:pointer;box-shadow:var(--shadow);
}
.loadmore:active{transform:scale(.99)}

/* ---------- 番茄钟 ---------- */
.pomo{display:flex;flex-direction:column;align-items:center;padding:22px 18px 4px}
.ring-wrap{position:relative;width:196px;height:196px;margin-bottom:16px;cursor:zoom-in;border-radius:50%}
.ring{width:196px;height:196px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.ring .bgc{stroke:var(--line)}
.ring .fg{stroke:url(#pomoGrad);transition:stroke-dashoffset .5s linear}
.ring-wrap:focus-visible{outline:2px solid var(--brand);outline-offset:4px}
.zoom-tip{
  position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);
  font-size:11px;color:var(--muted);background:var(--card);
  padding:2px 9px;border-radius:999px;border:1px solid var(--line);
  white-space:nowrap;pointer-events:none;opacity:.9;
}
.ring-wrap.live .zoom-tip{color:var(--brand);border-color:var(--brand-soft);background:var(--brand-soft)}

/* ---------- 全屏倒计时 ---------- */
html.pf-lock, html.pf-lock body{overflow:hidden;height:100%}
.pomo-full{
  position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:0;
  background:var(--pf-bg);
  color:var(--pf-text);
  padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 20px);
  animation:pfIn .18s ease-out;
  -webkit-user-select:none;user-select:none;
  transition:background .25s ease, color .25s ease;
}
.pomo-full[hidden]{display:none}
@keyframes pfIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}

/* 沉浸模式：开始计时后除数字外全部淡出，点屏幕任意处再唤出 */
.pf-inner,.pf-tools,.pf-hint{transition:opacity .32s ease, transform .32s ease}
.pomo-full.pf-zen .pf-side{opacity:0;transform:translateY(8px);pointer-events:none}
.pomo-full.pf-zen .pf-tools{opacity:0;transform:translateY(14px);pointer-events:none}
.pomo-full.pf-zen .pf-hint{opacity:0;pointer-events:none}
.pomo-full.pf-zen .pf-ph{opacity:0}
.pomo-full.pf-zen .pf-ph,.pf-ph{transition:opacity .32s ease}
/* 沉浸时给个极淡的提示点，让用户知道点屏幕能唤回按钮 */
.pomo-full.pf-zen::after{
  content:"";position:absolute;bottom:calc(env(safe-area-inset-bottom) + 14px);left:50%;
  width:38px;height:3px;border-radius:99px;background:currentColor;opacity:.16;
  transform:translateX(-50%);
}
.pomo-full:not(.pf-zen)::after{display:none}
.pomo-full.pf-surfacing::after{display:none}

.pf-inner{
  flex:1;width:100%;min-height:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
}
.pf-ring{position:relative;width:min(78vw, 78vh, 560px);height:min(78vw, 78vh, 560px)}
.pf-ring .ring{width:100%;height:100%}
.pf-ring .ring circle{stroke-width:6}
.pf-ring .ring .bgc{stroke:var(--pf-ring-bg)}
.pf-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pf-num{
  font-size:min(21vw, 21vh, 168px);font-weight:800;line-height:1;letter-spacing:1px;
  font-variant-numeric:tabular-nums;text-shadow:var(--pf-num-shadow);
}
.pf-ph{margin-top:10px;font-size:min(4.2vw, 18px);color:var(--pf-muted);font-weight:600;letter-spacing:2px}
.pf-side{text-align:center;max-width:min(92vw, 620px)}
.pf-task{
  font-size:min(4.4vw, 18px);color:var(--pf-text);font-weight:600;line-height:1.5;
  word-break:break-word;white-space:pre-wrap;opacity:.92;
}
.pf-task:empty{display:none}
.pf-meta{margin-top:6px;font-size:min(3.4vw, 13px);color:var(--pf-muted)}
.pf-tools{
  flex:0 0 auto;display:flex;gap:9px;flex-wrap:wrap;justify-content:center;
  width:100%;max-width:560px;padding-top:6px;
}
.pf-tool{
  flex:1 1 0;min-width:76px;border:1px solid var(--pf-line);
  background:var(--pf-btn-bg);color:var(--pf-text);
  border-radius:999px;padding:13px 8px;font:inherit;font-size:14px;cursor:pointer;
}
.pf-tool:active{transform:scale(.97)}
.pf-tool.pf-exit{background:linear-gradient(135deg,var(--brand),var(--brand-2));border-color:transparent;font-weight:700;color:#fff}
.pf-hint{flex:0 0 auto;margin:12px 0 0;font-size:11.5px;color:var(--pf-muted);text-align:center;opacity:.85}

/* 横屏：圆环在左、信息与按钮在右，充分利用宽屏 */
@media (orientation:landscape) and (max-height:560px){
  .pomo-full{padding:calc(env(safe-area-inset-top) + 8px) 24px calc(env(safe-area-inset-bottom) + 8px)}
  .pf-inner{flex-direction:row;gap:min(6vw, 64px)}
  .pf-ring{width:min(62vh, 46vw);height:min(62vh, 46vw);flex:0 0 auto}
  .pf-num{font-size:min(17vh, 13vw)}
  .pf-side{text-align:left;max-width:min(40vw, 420px);flex:1 1 auto}
  .pf-ph{margin-top:6px;font-size:min(3vh, 14px)}
  .pf-task{font-size:min(3.6vh, 17px)}
  .pf-tools{max-width:min(40vw, 420px);gap:7px;padding-top:0}
  .pf-tool{padding:10px 6px;font-size:13px;min-width:64px}
  .pf-hint{margin-top:6px}
}
.ring-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.ring-mid .num{font-size:38px;font-weight:700;letter-spacing:1px;font-variant-numeric:tabular-nums}
.ring-mid .ph{font-size:12.5px;color:var(--muted)}
.pomo-modes{display:flex;gap:8px;margin-bottom:16px}
.pomo-actions{display:flex;gap:9px;width:100%;margin-bottom:14px}
.pomo-actions .btn{padding:13px 0;font-size:15px}
.pomo-stat{font-size:12.5px;color:var(--muted);text-align:center;line-height:1.9}
.switch{display:flex;align-items:center;gap:8px;justify-content:center;font-size:12.5px;color:var(--muted);padding:10px 0 2px;text-align:left}
.switch input{width:16px;height:16px;accent-color:var(--brand);flex:0 0 auto}
.pomo-custom{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:8px 0 2px}
.pomo-custom input{
  width:76px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;
  background:var(--card-2);color:var(--text);font:inherit;font-size:16px;
  text-align:center;outline:none;
}
.pomo-custom input:focus{border-color:var(--brand)}
.taskrow{width:100%;padding:0 0 8px}
.taskrow input{
  width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card-2);
  color:var(--text);padding:10px 12px;font:inherit;font-size:16px;outline:none;
}
.taskrow input:focus{border-color:var(--brand)}
.pchips{justify-content:center;padding:0 0 12px}
.ring-mid .tk{
  font-size:11px;color:var(--muted);max-width:132px;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.sched-list{max-height:46vh;overflow-y:auto;margin-top:4px}
.sess{padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.sess:last-child{border-bottom:0}
.sess .h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sess .h b{font-variant-numeric:tabular-nums}
.sess .h .du{color:var(--muted);font-size:12px}
.sess .tk2{color:var(--muted);font-size:12.5px;margin-top:3px;word-break:break-word}
.sess .day{font-size:12px;color:var(--muted);font-weight:600;margin:12px 0 2px}
.mini{
  border:1px solid var(--line);background:var(--card-2);color:var(--text);
  border-radius:10px;padding:8px 14px;font:inherit;font-size:13.5px;cursor:pointer;
}

/* ---------- 专注统计 ---------- */
.stat-body{padding:18px 18px 4px}
.stat-body h3{margin:0 0 8px;font-size:16px}
.stat-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--muted);
}
.stat-row:last-of-type{border-bottom:0}
.stat-row b{color:var(--text);font-weight:700}
.chart{display:flex;gap:6px;height:132px;margin:14px 0 4px}
.chart .col{flex:1;display:flex;flex-direction:column;height:100%;align-items:center}
.chart .v{height:15px;line-height:15px;font-size:10.5px;color:var(--muted)}
.chart .barwrap{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
.chart .bar{
  width:66%;min-height:3px;border-radius:6px 6px 3px 3px;
  background:linear-gradient(180deg,var(--brand),var(--brand-2));
}
.chart .d{height:16px;line-height:16px;font-size:10.5px;color:var(--muted)}
.chart-cap{text-align:center;font-size:11.5px;color:var(--muted);padding:2px 0 4px}
.sub-h{margin:16px 0 2px;font-size:13px;font-weight:700}

/* ---------- 番茄钟入口条 ---------- */
.pomobar{
  position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;width:100%;
  border:0;border-radius:14px;padding:13px 15px;margin-bottom:10px;cursor:pointer;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;
  box-shadow:0 8px 20px -10px rgba(91,108,255,.85);
  font:inherit;text-align:left;
}
.pomobar:active{transform:scale(.99)}
.pomobar .picon{flex:0 0 auto;font-size:21px;line-height:1}
.pomobar .ptxt{flex:1;min-width:0;font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pomobar .pmeta{flex:0 0 auto;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.3px}
.pomobar .pfill{position:absolute;left:0;bottom:0;height:3px;width:0;background:rgba(255,255,255,.85);transition:width .5s linear}
.pomobar.live{animation:pomopulse 2.6s ease-in-out infinite}
@keyframes pomopulse{
  0%,100%{box-shadow:0 8px 20px -10px rgba(91,108,255,.85)}
  50%{box-shadow:0 10px 26px -8px rgba(91,108,255,1)}
}
.pomobar.rest{background:linear-gradient(135deg,#2f9e6e,#57c99a);box-shadow:0 8px 20px -10px rgba(47,158,110,.8)}

/* ---------- 考试倒计时 ---------- */
.exam{
  display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:9px 12px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer;
}
.exam:active{transform:scale(.995)}
.exam .cd{flex:0 0 auto;font-size:12.5px;color:var(--muted)}
.exam .cd b{font-size:21px;font-weight:800;color:var(--brand);font-variant-numeric:tabular-nums;margin-right:3px}
.exam .ename{flex:1;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exam .go{flex:0 0 auto;font-size:11.5px;color:var(--muted)}
.exam.urgent{border-color:var(--brand);background:var(--brand-soft)}
.exam.urgent .cd b{color:var(--danger)}

/* ---------- 科目 ---------- */
/* 科目条：允许换行、绝不横向滚动，保证每个科目文字完整可见 */
.subjbar{display:flex;flex-wrap:wrap;gap:7px;padding:0 0 9px}
.subjbar .chip{flex:0 0 auto}
/* 番茄钟弹窗内的科目条：居中排列，两边留白避免首尾被裁切 */
.psubj{justify-content:center;padding:0 2px 12px}
.psubj .chip{padding:6px 14px}
.chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.chip.subj{color:var(--text)}
.badge{
  display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;white-space:nowrap;
  border:1px solid var(--line);color:var(--muted);background:var(--card-2);
}
.badge.pick{cursor:pointer}
.badge .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;vertical-align:1px}

/* ---------- 今日目标 ---------- */
.goals{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 14px;margin:12px 0 4px;box-shadow:var(--shadow);
}
.goals .gh{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.goals .gh b{font-size:13.5px}
.goals .gh .pct{flex:1;text-align:right;font-size:12px;color:var(--muted)}
.goal{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:14px;cursor:pointer}
.goal input{flex:0 0 auto;width:17px;height:17px;accent-color:var(--brand)}
.goal span.t{flex:1;word-break:break-word}
.goal span.done{color:var(--muted);text-decoration:line-through}

/* ---------- 分科横条 ---------- */
.hbar{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:12.5px;color:var(--muted)}
.hbar .n{flex:0 0 auto;width:70px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.hbar .t{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.hbar .t i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand-2))}
.hbar .m{flex:0 0 auto;width:76px;text-align:right;font-variant-numeric:tabular-nums}

#menuBtn{position:relative}
#menuBtn .thedot{
  position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;
  background:#ffcf5b;border:1.5px solid rgba(255,255,255,.9);display:none;
}
.hint{font-size:12px;color:var(--muted);line-height:1.85;margin:12px 0 0;white-space:pre-wrap}
.dlg-body select,
.dlg-body input[type=date]{
  width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card-2);
  color:var(--text);padding:10px 12px;font:inherit;font-size:16px;outline:none;
}
.dlg-body input+label{margin-top:12px}

/* ---------- 间隔复习 ---------- */
.revcard{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden;
}
.revcard.over{border-color:#ffcf5b}
.revhead{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  border:0;background:none;color:var(--text);font:inherit;padding:11px 13px;cursor:pointer;
}
.revhead .rvi{flex:0 0 auto;font-size:16px;line-height:1}
.revhead .rvt{flex:1;min-width:0;font-size:13.5px;font-weight:700}
.revhead .rvt b{color:var(--brand);font-size:16px;font-variant-numeric:tabular-nums;margin:0 2px}
.revhead .rvm{flex:0 0 auto;font-size:11px;color:var(--muted);white-space:nowrap}
.revlist{max-height:42vh;overflow-y:auto;border-top:1px solid var(--line)}
.revitem{padding:10px 13px;border-bottom:1px solid var(--line)}
.revitem:last-child{border-bottom:0}
.rvtx{
  font-size:13.5px;line-height:1.5;word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.rvmeta{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 7px}
.rvact{display:flex;gap:7px}
.rvact .mini{flex:1;padding:7px 0;font-size:13px;text-align:center}
.rvact .mini.ok{background:var(--brand-soft);border-color:transparent;color:var(--brand);font-weight:600}
.revbadge{cursor:pointer;border-color:var(--brand-soft);background:var(--brand-soft);color:var(--brand)}
.revbtn{
  width:46px;height:46px;flex:0 0 auto;border:1px solid var(--line);border-radius:14px;
  background:var(--card-2);color:var(--muted);font-size:18px;line-height:1;cursor:pointer;
}
.revbtn:active{transform:scale(.96)}
.revbtn.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.revset{display:flex;gap:7px;flex-wrap:wrap}
.revset .mini{flex:0 0 auto;padding:7px 12px;font-size:12.5px}
.revset .mini.on{background:var(--brand-soft);border-color:transparent;color:var(--brand);font-weight:600}

/* ---------- 学习趋势 ---------- */
.wow{display:flex;gap:10px;margin:10px 0 2px}
.wow .cell{flex:1;min-width:0;background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:9px 10px}
.wow .cell .k{font-size:11.5px;color:var(--muted)}
.wow .cell .v{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
.wow .cell .s{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.5}
.delta{font-weight:700;white-space:nowrap}
.delta.up{color:var(--ok)}
.delta.down{color:var(--danger)}
.spark{display:block;width:100%;height:auto;margin:10px 0 0}
.spark .axis{stroke:var(--line);stroke-width:1}
.spark .cur{fill:none;stroke:var(--brand);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.spark .prev{fill:none;stroke:var(--muted);stroke-width:1.6;stroke-dasharray:4 4;opacity:.6}
.spark .pt{fill:var(--brand)}
.spark .xl{font-size:9px;fill:var(--muted)}
.spark .yl{font-size:9px;fill:var(--muted)}
.spark-legend{display:flex;gap:14px;justify-content:center;font-size:11px;color:var(--muted);padding:2px 0 4px}
.spark-legend i{display:inline-block;width:14px;height:2px;vertical-align:3px;margin-right:4px;border-radius:2px;background:var(--brand)}
.spark-legend i.dash{background:none;border-top:2px dashed var(--muted)}
.donut-wrap{display:flex;align-items:center;gap:14px;margin:12px 0 2px}
.donut{position:relative;flex:0 0 auto;width:104px;height:104px;border-radius:50%}
.donut::after{content:"";position:absolute;inset:24px;border-radius:50%;background:var(--card)}
.donut .dmid{
  position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  font-size:10.5px;color:var(--muted);line-height:1.4;
}
.donut .dmid b{font-size:14px;color:var(--text);font-variant-numeric:tabular-nums}
.legend{flex:1;min-width:0}
.legend .li{display:flex;align-items:center;gap:6px;font-size:12px;padding:3px 0;color:var(--muted)}
.legend .li i{flex:0 0 auto;width:9px;height:9px;border-radius:3px}
.legend .li .ln{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.legend .li .lv{flex:0 0 auto;font-variant-numeric:tabular-nums}
.cmp{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:12px;color:var(--muted)}
.cmp .cn{flex:0 0 auto;width:62px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.cmp .cbars{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.cmp .cb{display:block;height:7px;border-radius:99px;background:var(--card-2);overflow:hidden}
.cmp .cb i{display:block;height:100%;border-radius:99px;min-width:2px}
.cmp .cb.p i{background:var(--line)}
.cmp .cv{flex:0 0 auto;width:66px;text-align:right;font-size:10.5px;line-height:1.5;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="bar">
      <h1>StudyBuddy<small id="subtitle">27 考研 · 间隔复习 · 学习趋势 · v3.1</small></h1>
      <button class="icon-btn" id="themeBtn" title="切换深浅色" aria-label="切换深浅色主题">◐</button>
      <button class="icon-btn" id="menuBtn" title="更多" aria-label="更多功能菜单">⋯<span class="thedot" id="bkDot"></span></button>
    </div>
    <div class="stat">
      <span>今天 <b id="stToday">0</b> 条</span>
      <span>共 <b id="stTotal">0</b> 条</span>
      <span>连续 <b id="stStreak">0</b> 天</span>
      <span>🍅 今日 <b id="stPomo">0</b> 个</span>
      <span>🎯 目标 <b id="stGoal">0/0</b></span>
      <span>🔁 待复习 <b id="stRev">0</b></span>
    </div>
  </header>

  <div class="toolbar">
    <div class="exam" id="examStrip" title="点一下设置考试日期">
      <span class="cd"><b id="examDays">--</b>天后</span>
      <span class="ename" id="examName">27 考研初试</span>
      <span class="go">设置 ›</span>
    </div>
    <div class="revcard" id="reviewCard" hidden></div>
    <button class="pomobar" id="pomoBar" type="button">
      <span class="picon">🍅</span>
      <span class="ptxt" id="pomoBarText">开始一个番茄钟</span>
      <span class="pmeta" id="pomoBarMeta">25 分钟</span>
      <span class="pfill" id="pomoBarFill"></span>
    </button>
    <div class="search">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
      </svg>
      <input id="search" type="search" placeholder="搜索内容或标签…" autocomplete="off" aria-label="搜索笔记内容或标签">
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <main id="list"></main>

  <footer>
    <div class="subjbar" id="subjBar"></div>
    <div class="crow">
      <textarea id="composer" rows="1" placeholder="记点什么… 例如：数学二 做了 30 道极限题"></textarea>
      <button class="revbtn" id="revBtn" type="button" title="把这条加入间隔复习" aria-label="把这条加入间隔复习" aria-pressed="false">🔁</button>
      <button id="send" disabled>发送</button>
    </div>
  </footer>
</div>

<dialog id="editDlg">
  <div class="dlg-body">
    <h3>编辑这条记录</h3>
    <textarea id="editText"></textarea>
    <label style="margin-top:12px">科目</label>
    <select id="editSubj"></select>
    <label style="margin-top:12px">间隔复习</label>
    <div class="revset" id="editRev"></div>
    <p class="hint" id="editRevHint" style="margin-top:8px"></p>
  </div>
  <div class="dlg-actions">
    <button class="btn danger" id="editDel">删除</button>
    <button class="btn" id="editCancel">取消</button>
    <button class="btn primary" id="editSave">保存</button>
  </div>
</dialog>

<dialog id="menuDlg">
  <button class="menu-row" data-act="copyJson"><span class="em">📋</span><span>复制备份到剪贴板<small>粘到微信收藏 / 备忘录，换手机也不怕</small></span></button>
  <button class="menu-row" data-act="exportJson"><span class="em">⤓</span><span>导出 JSON 备份文件<small>完整数据，可再导入回来</small></span></button>
  <button class="menu-row" data-act="exportMd"><span class="em">📄</span><span>导出 Markdown<small>按日期分组，方便放进笔记软件</small></span></button>
  <button class="menu-row" data-act="import"><span class="em">⤒</span><span>从文件导入<small>与现有记录合并（重复的会跳过）</small></span></button>
  <button class="menu-row" data-act="pasteJson"><span class="em">📥</span><span>从剪贴板导入<small>把之前复制的备份粘回来</small></span></button>
  <button class="menu-row" data-act="sched"><span class="em">📅</span><span>完成的学习日程<small>每个番茄完成的记录，可按天复盘</small></span></button>
  <button class="menu-row" data-act="goals"><span class="em">🎯</span><span>每日目标设置<small>每天都要做的事，天天重置</small></span></button>
  <button class="menu-row" data-act="subjects"><span class="em">🏷</span><span>科目设置<small>数二 / 英二 / 政治 / 半导体物理</small></span></button>
  <button class="menu-row" data-act="clear"><span class="em">🗑</span><span>清空全部<small>谨慎，建议先备份</small></span></button>
  <button class="menu-row" data-act="close"><span class="em">✕</span><span>关闭</span></button>
</dialog>

<dialog id="pomoDlg">
  <div class="pomo">
    <div class="ring-wrap" id="pomoRingWrap" role="button" tabindex="0"
         title="点击放大到全屏" aria-label="点击放大到全屏倒计时">
      <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
        <defs>
          <linearGradient id="pomoGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#5b6cff"/>
            <stop offset="1" stop-color="#8a5cff"/>
          </linearGradient>
        </defs>
        <circle class="bgc" cx="60" cy="60" r="54"/>
        <circle class="fg" id="ringFg" cx="60" cy="60" r="54"
                stroke-dasharray="339.292" stroke-dashoffset="0"/>
      </svg>
      <div class="ring-mid">
        <div class="num" id="pomoNum">25:00</div>
        <div class="ph" id="pomoPhase">专注</div>
        <div class="tk" id="pomoTaskShow"></div>
      </div>
      <span class="zoom-tip" id="zoomTip">点击放大 ⤢</span>
    </div>

    <div class="subjbar psubj" id="pomoSubj"></div>

    <div class="taskrow">
      <input type="text" id="pomoTask" placeholder="这次专注做什么？例如：极限 30 题（可留空）" autocomplete="off">
    </div>
    <div class="chips pchips" id="pomoRecent"></div>

    <div class="pomo-modes" id="pomoModes">
      <button class="chip" data-min="15">15 分钟</button>
      <button class="chip on" data-min="25">25 分钟</button>
      <button class="chip" data-min="45">45 分钟</button>
    </div>

    <div class="pomo-custom">
      <span>自定义专注</span>
      <input type="number" id="pomoCustom" min="1" max="180" step="5" inputmode="numeric" value="25">
      <span>分钟</span>
      <button class="mini" id="pomoCustomSet">设定</button>
    </div>

    <div class="pomo-actions">
      <button class="btn primary" id="pomoToggle">开始</button>
      <button class="btn" id="pomoReset">重置</button>
      <button class="btn" id="pomoSkip">跳过</button>
    </div>

    <div class="pomo-stat" id="pomoStat">今日 0 个番茄 · 专注 0 分钟</div>
    <label class="switch">
      <input type="checkbox" id="pomoAutoLog" checked>
      <span>完成一个番茄时，自动往日志里记一条</span>
    </label>
  </div>
  <div class="dlg-actions">
    <button class="btn" id="pomoSched">学习日程</button>
    <button class="btn" id="pomoStats">专注统计</button>
    <button class="btn primary" id="pomoClose">关闭</button>
  </div>
</dialog>

<!-- 全屏倒计时（独立于 dialog，避开 top-layer 与 polyfill 差异） -->
<div id="pomoFull" class="pomo-full" hidden aria-hidden="true">
  <div class="pf-inner">
    <div class="pf-ring" id="pfRingWrap">
      <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
        <defs>
          <linearGradient id="pfGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#5b6cff"/>
            <stop offset="1" stop-color="#8a5cff"/>
          </linearGradient>
        </defs>
        <circle class="bgc" cx="60" cy="60" r="54"/>
        <circle class="fg" id="pfRingFg" cx="60" cy="60" r="54"
                stroke-dasharray="339.292" stroke-dashoffset="0" stroke="url(#pfGrad)"/>
      </svg>
      <div class="pf-mid">
        <div class="pf-num" id="pfNum">25:00</div>
        <div class="pf-ph" id="pfPhase">专注</div>
      </div>
    </div>
    <div class="pf-side">
      <div class="pf-task" id="pfTask"></div>
      <div class="pf-meta" id="pfMeta"></div>
    </div>
  </div>

  <div class="pf-tools" id="pfTools" aria-hidden="false">
    <button class="pf-tool" id="pfToggle" type="button">暂停</button>
    <button class="pf-tool" id="pfSkip" type="button">跳过</button>
    <button class="pf-tool" id="pfTheme" type="button">浅色</button>
    <button class="pf-tool" id="pfFullApi" type="button">横屏</button>
    <button class="pf-tool pf-exit" id="pfExit" type="button">退出全屏</button>
  </div>
  <p class="pf-hint" id="pfHint">按 Esc 也可退出 · 点屏幕任意处可呼出按钮</p>
</div>

<dialog id="schedDlg">
  <div class="stat-body">
    <h3>完成的学习日程</h3>
    <div id="schedRows"></div>
    <div class="sched-list" id="schedList"></div>
  </div>
  <div class="dlg-actions">
    <button class="btn" id="schedCopy">复制日程</button>
    <button class="btn danger" id="schedClear">清空</button>
    <button class="btn primary" id="schedClose">关闭</button>
  </div>
</dialog>

<dialog id="statDlg">
  <div class="stat-body">
    <h3>专注统计</h3>
    <div id="statRows"></div>
    <div class="sub-h">本周 vs 上周</div>
    <div id="statWow"></div>
    <div class="sub-h">科目占比 · 本周</div>
    <div id="statDonut"></div>
    <div class="sub-h">分科对比（本周 / 上周）</div>
    <div id="statSubj"></div>
    <div class="chart" id="statChart"></div>
    <div class="chart-cap">最近 7 天专注时长（分钟）</div>
  </div>
  <div class="dlg-actions">
    <button class="btn danger" id="statClear">清空统计</button>
    <button class="btn primary" id="statClose">关闭</button>
  </div>
</dialog>

<dialog id="examDlg">
  <div class="dlg-body">
    <h3>考试倒计时</h3>
    <label>名称</label>
    <input type="text" id="examNameIn" placeholder="例如：27 考研初试">
    <label>初试日期</label>
    <input type="date" id="examDateIn">
    <p class="hint" id="examHint"></p>
  </div>
  <div class="dlg-actions">
    <button class="btn" id="examCancel">取消</button>
    <button class="btn primary" id="examSave">保存</button>
  </div>
</dialog>

<dialog id="goalsDlg">
  <div class="dlg-body">
    <h3>每日目标</h3>
    <label>每天都要做的事（每天自动重置打勾）</label>
    <div id="goalList"></div>
    <label>添加一条</label>
    <input type="text" id="goalNew" placeholder="例如：数学二 1 章练习">
    <label>归属科目（可选）</label>
    <select id="goalSubjSel"></select>
    <div class="dlg-actions" style="padding:12px 0 0">
      <button class="btn primary" id="goalAdd">添加</button>
    </div>
  </div>
  <div class="dlg-actions">
    <button class="btn primary" id="goalsClose">完成</button>
  </div>
</dialog>

<dialog id="delSubjDlg">
  <div class="dlg-body">
    <h3>删除科目</h3>
    <p class="hint" id="delSubjMsg" style="margin-top:0"></p>
    <p class="hint" style="margin-top:8px">请选择这些笔记的处理方式：</p>
  </div>
  <div class="dlg-actions dlg-actions-col">
    <button class="btn primary" id="delSubjMove">移到「其他」科目</button>
    <button class="btn" id="delSubjKeep">保留标记（之后在「未分类」里筛选）</button>
    <button class="btn danger" id="delSubjCancel">放弃删除</button>
  </div>
</dialog>

<dialog id="subjDlg">

/* ---- 老浏览器 <dialog> polyfill（iOS Safari < 15.4 等）：showModal / close / open / ESC ---- */
(function(){
  /* 判定要严：部分早期实现有构造函数但没有 showModal，只看 HTMLDialogElement 会误判后直接崩 */
  const ok = typeof window.HTMLDialogElement !== "undefined" &&
             window.HTMLDialogElement.prototype &&
             typeof window.HTMLDialogElement.prototype.showModal === "function" &&
             typeof window.HTMLDialogElement.prototype.close === "function";
  if(ok) return;
  const css = document.createElement("style");
  css.textContent =
    "dialog{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);display:none;margin:0;z-index:99}" +
    "dialog[open]{display:block}" +
    ".dlg-backdrop{position:fixed;inset:0;background:rgba(12,14,22,.5);backdrop-filter:blur(2px);z-index:98}";
  document.head.appendChild(css);
  const stack = [];
  function bind(d){
    if(d.__dlgPoly) return;
    d.__dlgPoly = true;
    d.open = false;
    let backdrop = null, lastFocus = null;
    d.showModal = function(){
      if(d.open) return;
      lastFocus = document.activeElement;
      d.open = true;
      d.setAttribute("open", "");
      backdrop = document.createElement("div");
      backdrop.className = "dlg-backdrop";
      /* 与原生 <dialog> 保持一致的策略：点遮罩不关闭（避免误触丢掉正在编辑的内容），
         关闭一律靠明确的按钮或 Esc。 */
      document.body.appendChild(backdrop);
      document.body.style.overflow = "hidden";
      stack.push(d);
      const f = d.querySelector("input,textarea,select,button");
      if(f) setTimeout(() => { try{ f.focus(); }catch(e){} }, 40);
    };
    d.show = function(){
      if(d.open) return;
      d.open = true;
      d.setAttribute("open", "");
    };
    d.close = function(){
      if(!d.open) return;
      d.open = false;
      d.removeAttribute("open");
      if(backdrop){ backdrop.remove(); backdrop = null; }
      const i = stack.indexOf(d);
      if(i >= 0) stack.splice(i, 1);
      if(!stack.length) document.body.style.overflow = "";
      if(lastFocus && lastFocus.focus){ try{ lastFocus.focus(); }catch(e){} }
    };
  }
  const bindAll = () => document.querySelectorAll("dialog").forEach(bind);
  bindAll();
  document.addEventListener("DOMContentLoaded", bindAll);
  document.addEventListener("keydown", (e) => {
    if(e.key !== "Escape" || !stack.length) return;
    stack[stack.length - 1].close();
    e.preventDefault();
  });
})();

const SUBJ_HUES = [222, 268, 340, 152, 200, 30, 300, 12];

/* ---------------- 间隔重复 / 复习提醒 ----------------
   给笔记加一个 reviewAt（下次复习日，YYYY-MM-DD）。有它才进复习队列，
   空字符串 = 不复习。reviewStage 记录「已完成的复习轮次」，决定下一次的间隔；
   走完 REV_STEPS 最后一档即毕业，reviewAt 清空但 reviewStage 留在 REV_MAX，
   这样「已毕业」和「从没排过复习」两种状态还能区分开（见 revGraduated()）。 */
const REV_STEPS = [1, 2, 4, 7, 15, 30, 60];
const REV_MAX = REV_STEPS.length;

function revNormDay(v){
  return (typeof v === "string" && /^\d{4}-\d{2}-\d{2}$/.test(v)) ? v : "";
}
function revToday(){ return dayKey(new Date()); }
function dayShift(days){
  const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() + days);
  return dayKey(d);
}
function dayDiff(fromKey, toKey){
  const a = new Date(fromKey + "T00:00:00"), b = new Date(toKey + "T00:00:00");
  if(isNaN(a.getTime()) || isNaN(b.getTime())) return 0;
  return Math.round((b - a) / 86400000);
}
function revActive(n){ return !!(n && n.reviewAt); }
/* 到期的排前面，同一天里按原顺序（notes 本身是正序追加的） */
function revDueList(){
  const t = revToday();
  return notes.filter(n => revActive(n) && n.reviewAt <= t)
              .sort((a, b) => (a.reviewAt < b.reviewAt ? -1 : a.reviewAt > b.reviewAt ? 1 : 0));
}
function revQueued(){
  const t = revToday();
  return notes.filter(n => revActive(n) && n.reviewAt > t).length;
}
function revGraduated(){ return notes.filter(n => n && !n.reviewAt && n.reviewStage >= REV_MAX).length; }
/* 复习状态的短标签，列表徽章与复习卡共用，避免两处文案漂移 */
function revShort(n){
  if(!revActive(n)) return "";
  const d = dayDiff(revToday(), n.reviewAt);
  if(d < 0) return "复习逾期 " + (-d) + " 天";
  if(d === 0) return "今天该复习";
  return "复习 · " + d + " 天后";
}
function revStageText(n){
  const s = Math.min(Math.max(0, n.reviewStage || 0), REV_MAX);
  return s >= REV_MAX ? "已毕业" : "第 " + (s + 1) + "/" + REV_MAX + " 轮";
}
function revMark(id, ok){
  const n = notes.find(x => x.id === id);
  if(!n || !revActive(n)) return;
  n.reviewLast = revToday();
  if(ok){
    const next = Math.min((n.reviewStage || 0) + 1, REV_MAX);
    n.reviewStage = next;
    if(next >= REV_MAX){
      n.reviewAt = "";
      toast("已完成 " + REV_MAX + " 轮复习，这条毕业啦 🎉");
    }else{
      n.reviewAt = dayShift(REV_STEPS[next]);
      toast("很好 · " + REV_STEPS[next] + " 天后再复习一遍");
    }
  }else{
    /* 记不住就回到第一档重来，这是间隔重复里最关键的一步 */
    n.reviewStage = 0;
    n.reviewAt = dayShift(REV_STEPS[0]);
    toast("已重新排入队列，明天再来一遍");
  }
  persist();
}
function revLater(id){
  const n = notes.find(x => x.id === id);
  if(!n) return;
  n.reviewAt = dayShift(1);
  persist();
  toast("明天再提醒你");
}
function shortText(t, n){
  const s = String(t == null ? "" : t).replace(/\s+/g, " ").trim();
  return s.length > n ? s.slice(0, n) + "…" : s;
}
let revOpen = false;      // 首页复习卡展开状态（只在本次会话内有效，不落盘）
let revDraft = false;     // 输入框旁「加入复习」开关

function renderReviewCard(){
  const box = $("reviewCard"); if(!box) return;

  if(!due.length){

  const overdue = due.filter(n => n.reviewAt < revToday()).length;
  box.hidden = false;
  box.classList.toggle("over", overdue > 0);
  let html =
    '<button class="revhead" id="revHead" type="button" aria-expanded="' + (revOpen ? "true" : "false") + '">' +
      '<span class="rvi">🔁</span>' +
      '<span class="rvt">今天该复习 <b>' + due.length + '</b> 条</span>' +
      '<span class="rvm">' + (overdue ? "逾期 " + overdue + " · " : "") +
        "队列 " + revQueued() + " · 已毕业 " + revGraduated() + (revOpen ? " ▲" : " ▼") + "</span>" +
    "</button>";
  if(revOpen){
    html += '<div class="revlist">' + due.map((n, i) =>
      '<div class="revitem">' +
        '<div class="rvtx">' + esc(shortText(n.text, 96)) + "</div>" +

          (n.subj ? '<span class="badge"><span class="dot" style="background:' + subjColor(n.subj) + '"></span>' + esc(n.subj) + "</span>" : "") +
          '<span class="badge">' + esc(revShort(n)) + " · " + esc(revStageText(n)) + "</span>" +
        "</div>" +
        '<div class="rvact">' +
          /* 用下标而不是 id 做 data 属性：id 来自存储/导入，直接拼进 HTML 属性会被注坏 */
          '<button class="mini ok" type="button" data-rv="ok" data-ri="' + i + '">记住了</button>' +
          '<button class="mini" type="button" data-rv="no" data-ri="' + i + '">还不熟</button>' +
          '<button class="mini" type="button" data-rv="later" data-ri="' + i + '">明天</button>' +
        "</div>" +
      "</div>").join("") + "</div>";
  }
  box.innerHTML = html;
}
function initReview(){
  const box = $("reviewCard");
  if(box){

/* 把任意来源的数据规整成合法形状：缺 text / tags / createdAt 都不该让页面崩掉 */
function normalizeNote(n){
  if(!n || typeof n !== "object") return null;
  const text = typeof n.text === "string" ? n.text : (n.text == null ? "" : String(n.text));
  let tags = Array.isArray(n.tags) ? n.tags.filter(t => typeof t === "string" && t) : parseTags(text);
  let createdAt = typeof n.createdAt === "string" ? n.createdAt : "";
  if(!createdAt || isNaN(new Date(createdAt).getTime())) createdAt = new Date().toISOString();
  /* 复习字段同样要兜底：导入的备份可能来自旧版本（没有这些字段），
     也可能被人手工改坏（reviewStage 是字符串、reviewAt 是乱码日期）。 */
  let stage = Number(n.reviewStage);
  if(!isFinite(stage) || stage < 0) stage = 0;
  stage = Math.min(Math.floor(stage), REV_MAX);
  const reviewAt = revNormDay(n.reviewAt);
  return {
    id: (n.id && String(n.id)) || uid(),
    text: text,
    tags: tags,
    subj: typeof n.subj === "string" ? n.subj : "",
    createdAt: createdAt,
    updatedAt: typeof n.updatedAt === "string" ? n.updatedAt : null,
    reviewAt: reviewAt,
    reviewStage: stage,
    reviewLast: revNormDay(n.reviewLast)
  };
}
function load(){
  let raw = null;
  try{
    raw = localStorage.getItem(KEY_NOTES);
    const arr = raw ? JSON.parse(raw) : [];
    notes = Array.isArray(arr) ? arr.map(normalizeNote).filter(Boolean) : [];
  }catch(e){ notes = []; }
  /* 关键：把当前快照记为基准。置 null 会让 persist() 的判重失效，
     被删掉的记录会被当成“远端新增”吸回来，删除直接失效。 */
  syncedRaw = raw;
}
function persist(){
  /* 写前合并：先吸收其他标签页新写入、本地还没有的记录，避免全量覆盖造成丢数据。
     关键：以“上次同步过的快照 syncedRaw”为基准对比，只并入真正的新增，
     否则刚删掉的记录会被当成“远端新增”又吸回来，删除直接失效。 */
  try{
    const raw = localStorage.getItem(KEY_NOTES);
    if(raw && raw !== syncedRaw){
      const remote = JSON.parse(raw);
      if(Array.isArray(remote)){
        let prevIds = null;
        try{ prevIds = new Set(JSON.parse(syncedRaw || "[]").map(n => n && n.id)); }catch(e){}
        const localIds = new Set(notes.map(n => n.id));
        remote.forEach(n => {
          if(!n || !n.id) return;
          if(localIds.has(n.id)) return;
          if(prevIds && prevIds.has(n.id)) return;   // 我们自己删掉的，不再吸回来
          /* 远端数据同样过一遍规范化：它可能来自旧版本或别的设备，
             字段缺失会让当前这次会话里的渲染直接踩空。 */
          const nn = normalizeNote(n);
          if(nn) notes.push(nn);
        });
      }
    }
  }catch(e){}
  try{
    const payload = JSON.stringify(notes);
    localStorage.setItem(KEY_NOTES, payload);
    syncedRaw = payload;
  }catch(e){ toast("保存失败：本地存储已满"); }
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
let storageWarnAt = 0;
function saveRaw(k, v){
  try{ localStorage.setItem(k, typeof v === "string" ? v : JSON.stringify(v)); }
  catch(e){
    /* 存储写满时不再静默吞掉，节流提醒一次，避免数据悄悄丢 */
    const now = Date.now();
    if(now - storageWarnAt > 60000){
      storageWarnAt = now;
      toast("本地存储空间不足，部分数据可能没保存；建议尽快导出备份");
    }
  }
}
function subjColor(name){
  /* 按名字哈希取色：增删科目后颜色不再整体漂移，历史统计图颜色稳定 */
  if(!name) return "hsl(222,10%,62%)";
  let h = 0;
  const s = String(name);
  for(let i = 0; i < s.length; i++){ h = (h * 31 + s.charCodeAt(i)) >>> 0; }
  return "hsl(" + SUBJ_HUES[h % SUBJ_HUES.length] + ",68%,58%)";
}
function loadExtra(){
  try{
    const ex = JSON.parse(localStorage.getItem(KEY_EXAM) || "null");
    /* 日期格式先过一遍：存储被改坏时别把非法日期读进内存 */
    if(ex && typeof ex.date === "string" && /^\d{4}-\d{2}-\d{2}$/.test(ex.date.trim())){
      exam = { name: typeof ex.name === "string" && ex.name ? ex.name : exam.name, date: ex.date.trim() };
    }
  }catch(e){}
  try{
    const sj = JSON.parse(localStorage.getItem(KEY_SUBJ) || "null");
    /* 过滤非字符串之外，也裁掉超长名字与超量条目：科目条是每次渲染都要重建的，
       脏数据会让它变慢，超长名字还会把整行撑坏。 */
    if(Array.isArray(sj) && sj.length){
      subjects = sj.filter(x => typeof x === "string" && x && x.length <= 24).slice(0, 60);
    }
  }catch(e){}
  const mkDefaults = () => DEFAULT_GOALS.map(x => ({ id: uid(), text: x.text, subj: x.subj }));
  try{
    const g = JSON.parse(localStorage.getItem(KEY_GOALS) || "null");
    /* id 会被拼进 data-gid 属性，只收「字母数字下划线短横」这种安全形态；
       其余一律重新生成，避免被篡改的存储把 HTML 注进属性里。 */
    const safeId = (v) => typeof v === "string" && /^[A-Za-z0-9_-]{1,64}$/.test(v) ? v : uid();
    if(Array.isArray(g)){
      /* 只要是数组就原样读入——包括「空数组」：用户删光目标后，这里若再生成默认值，
         删掉的目标会「复活」。 */
      goals = g.filter(x => x && typeof x.text === "string" && x.text)
               .map(x => ({ id: safeId(x.id), text: x.text, subj: typeof x.subj === "string" ? x.subj : "" }));
    }else{
      /* 只有「首次使用 / key 损坏」才生成默认目标，且生成后立刻写回存储，
         否则默认目标的 id 每次刷新都重新随机，用户对默认目标的打卡记录全对不上、刷新即丢。 */
      goals = mkDefaults();
      saveRaw(KEY_GOALS, goals);
    }
  }catch(e){ goals = mkDefaults(); saveRaw(KEY_GOALS, goals); }
  try{ const gl = JSON.parse(localStorage.getItem(KEY_GOALLOG) || "null"); if(gl && typeof gl === "object") goalLog = gl; }catch(e){}
  pruneGoalLog();
  try{
    const ss = JSON.parse(localStorage.getItem(KEY_SESS) || "null");
    sessions = Array.isArray(ss) ? ss.filter(x => x && x.minutes) : [];
  }catch(e){ sessions = []; }
  try{
    const ar = JSON.parse(localStorage.getItem(KEY_SESS_ARC) || "null");
    archivedSessions = Array.isArray(ar) ? ar.filter(x => x && x.minutes) : [];
  }catch(e){ archivedSessions = []; }
  /* 历史版本或手工改过的数据可能不是正序，读入后立刻归位，
     否则 archiveSessions() 会把「最新的」当成「最旧的」归档掉。 */
  sortSessions();
  sortArchivedSessions();
  try{
    const rt = JSON.parse(localStorage.getItem(KEY_TASKS) || "null");
    recentTasks = Array.isArray(rt) ? rt.filter(x => typeof x === "string") : [];
  }catch(e){ recentTasks = []; }
  try{ pickSubj = localStorage.getItem(KEY_LASTSUBJ) || ""; }catch(e){}
}
function saveSessions(){ saveRaw(KEY_SESS, sessions); }
function archiveSessions(){
  /* 学习日程只增不减，超过保留上限的最旧记录自动归档，防止 localStorage 被撑爆。
     sessions 按时间正序追加，所以要归档的是**最早**的部分，保留最近 SESS_KEEP 条。 */
  if(sessions.length <= SESS_KEEP) return 0;
  const keepFrom = sessions.length - SESS_KEEP;
  const cut = sessions.slice(0, keepFrom);      // 较早的 → 归档
  sessions = sessions.slice(keepFrom);          // 最近的 → 留在列表里
  archivedSessions = cut.concat(archivedSessions);
  saveRaw(KEY_SESS_ARC, archivedSessions);
  saveSessions();
  return cut.length;
}
function mergeSessions(incoming){
  if(!Array.isArray(incoming)) return 0;
  const have = new Set(sessions.map(s => s.id).concat(archivedSessions.map(s => s.id)));
  let added = 0;
  incoming.forEach(s => {
    if(!s || !s.minutes || have.has(s.id)) return;
    sessions.push({
      id: s.id || uid(),
      day: s.day || dayKey(s.start || new Date()),
      start: s.start || null, end: s.end || null,
      minutes: s.minutes, subj: s.subj || "", task: s.task || ""
    });
    have.add(s.id);
    added++;
  });
  /* 关键：导入的备份可能来自别的设备、或顺序与本地不一致，push 会破坏「正序」约定。
     archiveSessions() 依赖正序来判断哪头是「最近的」，顺序一乱就会把最新记录归档掉、
     反而把最旧的留在活跃列表里。所以合并后必须重新按时间正序排一次。 */
  sortSessions();
  archiveSessions();
  saveSessions();
  return added;
}
/* 统一按「日期 + 开始时间」正序排列：日期字符串是 YYYY-MM-DD，可直接字典序比较。
   用一个比较器给活跃与归档两个数组共用，避免两处逻辑漂移。 */
function sessCmp(a, b){
  const da = String(a.day || ""), db = String(b.day || "");
  if(da !== db) return da < db ? -1 : 1;
  const sa = String(a.start || ""), sb = String(b.start || "");
  if(sa !== sb) return sa < sb ? -1 : 1;
  return 0;
}
function sortSessions(){ sessions.sort(sessCmp); }
function sortArchivedSessions(){ archivedSessions.sort(sessCmp); }
function rememberTask(name){
  const t = (name || "").trim();
  if(!t) return;
  recentTasks = [t].concat(recentTasks.filter(x => x !== t)).slice(0, 6);
  saveRaw(KEY_TASKS, recentTasks);
}

/* ---------------- 工具 ---------------- */
function parseTags(text){
  const out = [];
  /* 排除 . - / 等常见标点：否则「#数学二.」会把句号吞进标签名，「#Day-3」会把 -3 一起吞掉 */
  const re = /[#＃]([^\s#＃,，、。；;:：!！?？()（）\[\]{}.．\-—–_/\\|*"'“”‘’]+)/g;
  let m;
  while((m = re.exec(text)) !== null){
    const t = m[1].trim();
    if(t && !out.includes(t)) out.push(t);
  }
  return out;
}
const pad = (n) => String(n).padStart(2, "0");
const dayKey = (d) => { d = new Date(d); return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); };
const fmtTime = (iso) => { const d = new Date(iso); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
const WEEK = ["周日","周一","周二","周三","周四","周五","周六"];
function fmtDay(key){
  const today = dayKey(new Date());
  if(key === today) return "今天 · " + key.slice(5).replace("-","月") + "日";
  const y = new Date(); y.setDate(y.getDate()-1);
  if(key === dayKey(y)) return "昨天 · " + key.slice(5).replace("-","月") + "日";
  const [Y,M,D] = key.split("-").map(Number);
  const d = new Date(Y, M-1, D);
  return M + "月" + D + "日 " + WEEK[d.getDay()];
}
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("on");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toastEl.classList.remove("on"), 1900);
}
/* 带「撤销」按钮的 toast：删除等操作给 5 秒反悔窗口 */
const undoToastEl = $("undoToast"), undoMsgEl = $("undoMsg"), undoBtnEl = $("undoBtn");
let undoTimer = null, undoAction = null;
function toastUndo(msg, action){
  undoMsgEl.textContent = msg;
  undoAction = action;
  undoToastEl.classList.add("on");
  clearTimeout(undoTimer);
  undoTimer = setTimeout(() => { undoToastEl.classList.remove("on"); undoAction = null; }, 5000);
}
undoBtnEl.onclick = () => {
  clearTimeout(undoTimer);
  undoToastEl.classList.remove("on");
  const a = undoAction; undoAction = null;
  if(a) a();
};
function download(name, text, type){
  const blob = new Blob([text], {type: type || "text/plain;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function stamp(){
  const d = new Date();
  return d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + "-" + pad(d.getHours()) + pad(d.getMinutes());
}

/* ---------------- 渲染 ---------------- */
function visibleNotes(){
  const q = query.trim().toLowerCase();
  return notes
    .filter(n => !filterTag || (n.tags || []).includes(filterTag))
    .filter(n => {
      if(!filterSubj) return true;
      if(filterSubj === "__none__") return !n.subj || subjects.indexOf(n.subj) < 0;
      return (n.subj || "") === filterSubj;
    })
    .filter(n => {
      if(!q) return true;
      const text = typeof n.text === "string" ? n.text.toLowerCase() : "";
      return text.includes(q) || (n.tags || []).some(t => typeof t === "string" && t.toLowerCase().includes(q));
    })
    /* 按时间倒序。原来用 localeCompare 比 ISO 字符串：
       它受当前 locale 影响、不保证与字典序一致，几百条下也比直接比较慢得多。
       这里改成先算数值时间戳再比，顺序稳定且更快。 */
    .map(n => ({ n: n, ts: new Date(n.createdAt).getTime() || 0 }))
    .sort((a, b) => b.ts - a.ts)
    .map(x => x.n);
}
function renderChips(){
  const count = {};
  notes.forEach(n => (n.tags || []).forEach(t => count[t] = (count[t]||0)+1));
  const scount = {};
  let noneCount = 0;
  notes.forEach(n => {
    const s = n.subj || "";
    if(s && subjects.indexOf(s) >= 0) scount[s] = (scount[s]||0)+1;
    else noneCount++;                                   // 未选科目 + 科目已删除的都归入未分类
  });
  const tags = Object.keys(count).sort((a,b) => count[b]-count[a]).slice(0, 20);
  chips.innerHTML = "";
  const mkChip = (label, dot, isOn, onClick) => {
    const b = document.createElement("button");
    b.className = "chip" + (dot ? " subj" : "") + (isOn ? " on" : "");
    b.innerHTML = (dot ? '<span class="dot" style="background:' + dot + '"></span>' : "") + esc(label);
    b.onclick = onClick;
    chips.appendChild(b);
  };
  mkChip("全部", "", !filterTag && !filterSubj, () => { filterTag = ""; filterSubj = ""; render(); });
  subjects.forEach(s => {
    if(!scount[s]) return;
    mkChip(s + " " + scount[s], subjColor(s), filterSubj === s, () => {
      filterSubj = (filterSubj === s) ? "" : s; render();      // 不再清空标签与搜索词，三种过滤可叠加
    });
  });
  if(noneCount) mkChip("未分类 " + noneCount, "", filterSubj === "__none__", () => {
    filterSubj = (filterSubj === "__none__") ? "" : "__none__"; render();
  });
  tags.forEach(t => mkChip("#" + t + " " + count[t], "", filterTag === t, () => {
    filterTag = (filterTag === t) ? "" : t; render();          // 同上，保留科目与搜索词
  }));
}
function renderStats(){
  const today = dayKey(new Date());
  $("stToday").textContent = notes.filter(n => dayKey(n.createdAt) === today).length;
  $("stTotal").textContent = notes.length;
  // 连续记录天数
  const days = new Set(notes.map(n => dayKey(n.createdAt)));
  let streak = 0;
  const d = new Date();
  if(!days.has(dayKey(d))) d.setDate(d.getDate() - 1);   // 今天还没写，从昨天算
  while(days.has(dayKey(d))){ streak++; d.setDate(d.getDate() - 1); }
  $("stStreak").textContent = streak;
  if($("stPomo")) $("stPomo").textContent = todayPomo().count;
  if($("stRev")) $("stRev").textContent = revDueList().length;
  if($("stGoal")){
    const gl = goalLog[today] || {};

  }
}

  const note = normalizeNote({ text, tags: parseTags(text), subj: pickSubj || "", createdAt: new Date().toISOString() });
  if(revDraft){
    /* 「加入复习」开关打开时：第一次复习排在明天，之后由 revMark() 按艾宾浩斯推进 */
    note.reviewAt = dayShift(REV_STEPS[0]);
