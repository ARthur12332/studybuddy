<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>StudyBuddy · 日志笔记</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#5b6cff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StudyBuddy">
<meta name="description" content="轻量日志笔记：随手记，用 #标签 分类，支持搜索、导出、离线使用。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#f4f5f9; --card:#ffffff; --card-2:#fafbfe;
  --text:#1b1f2a; --muted:#7c8398; --line:#e6e8f0;
  --brand:#5b6cff; --brand-2:#8a5cff; --brand-soft:#eaecff;
  --danger:#e5484d; --ok:#2f9e6e;
  --shadow:0 1px 2px rgba(20,24,40,.05), 0 6px 18px -8px rgba(20,24,40,.16);
  --radius:16px;
}
html[data-theme="dark"]{
  --bg:#101218; --card:#191c24; --card-2:#1f232d;
  --text:#e8eaf2; --muted:#8b93a8; --line:#2a2f3c;
  --brand:#7c8bff; --brand-2:#a77cff; --brand-soft:#232744;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -10px rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:15px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  overscroll-behavior-y:none;
}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:720px;margin:0 auto}

/* ---------- 顶栏 ---------- */
header{
  padding:calc(env(safe-area-inset-top) + 14px) 16px 10px;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  color:#fff;border-radius:0 0 22px 22px;box-shadow:var(--shadow);
  position:relative;z-index:3;
}
.bar{display:flex;align-items:center;gap:10px}
h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.3px;flex:1}
h1 small{display:block;font-size:11px;font-weight:400;opacity:.85;letter-spacing:0}
.icon-btn{
  width:36px;height:36px;border:0;border-radius:12px;cursor:pointer;
  background:rgba(255,255,255,.18);color:#fff;font-size:16px;line-height:1;
  display:flex;align-items:center;justify-content:center;
}
.icon-btn:active{transform:scale(.94)}
.stat{margin-top:10px;font-size:12px;opacity:.92;display:flex;gap:14px;flex-wrap:wrap}
.stat b{font-size:14px}

/* ---------- 搜索 / 标签 ---------- */
.toolbar{padding:12px 16px 4px;background:var(--bg)}
.search{
  display:flex;align-items:center;gap:8px;background:var(--card);
  border:1px solid var(--line);border-radius:12px;padding:0 12px;box-shadow:var(--shadow);
}
.search svg{flex:0 0 16px;opacity:.45}
.search input{
  flex:1;border:0;background:transparent;color:var(--text);
  font-size:16px;padding:11px 0;outline:none;min-width:0;
}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--muted);
  padding:5px 12px;border-radius:999px;font-size:12.5px;cursor:pointer;white-space:nowrap;
}
.chip.on{background:var(--brand-soft);border-color:transparent;color:var(--brand);font-weight:600}

/* ---------- 列表 ---------- */
main{flex:1;overflow-y:auto;padding:6px 16px 18px;-webkit-overflow-scrolling:touch}
.day{
  display:flex;align-items:center;gap:10px;
  margin:16px 0 8px;font-size:12.5px;color:var(--muted);font-weight:600;
}
.day::after{content:"";flex:1;height:1px;background:var(--line)}
.note{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow);position:relative;
  animation:in .18s ease-out;
}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.note .txt{white-space:pre-wrap;word-break:break-word;margin:0 0 8px}
.note .txt:last-child{margin-bottom:0}
.note .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tag{
  font-size:11.5px;color:var(--brand);background:var(--brand-soft);
  border-radius:999px;padding:2px 9px;border:0;cursor:pointer;font-family:inherit;
}
.note .foot{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:11.5px}
.note .foot .sp{flex:1}
.link{border:0;background:none;color:var(--muted);font-size:11.5px;cursor:pointer;padding:2px 4px;font-family:inherit}
.link:hover{color:var(--brand)}
.empty{text-align:center;color:var(--muted);padding:56px 20px;font-size:13.5px;line-height:2}
.empty b{display:block;font-size:15px;color:var(--text);margin-bottom:6px}

/* ---------- 底部输入 ---------- */
footer{
  padding:9px 16px calc(env(safe-area-inset-bottom) + 10px);
  background:var(--card);border-top:1px solid var(--line);
  display:flex;flex-direction:column;align-items:stretch;
}
.crow{display:flex;gap:10px;align-items:flex-end}
#composer{
  flex:1;resize:none;border:1px solid var(--line);border-radius:14px;
  background:var(--card-2);color:var(--text);padding:11px 13px;
  font:inherit;font-size:16px;line-height:1.5;outline:none;
  max-height:132px;min-height:46px;
}
#composer:focus{border-color:var(--brand)}
#send{
  width:52px;height:46px;border:0;border-radius:14px;cursor:pointer;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;
  font-size:15px;font-weight:600;flex:0 0 auto;
}
#send:active{transform:scale(.96)}
#send:disabled{opacity:.45}

/* ---------- 弹层 ---------- */
dialog{
  border:0;border-radius:18px;padding:0;width:min(92vw,420px);
  max-height:88vh;max-height:88dvh;overflow-y:auto;
  background:var(--card);color:var(--text);box-shadow:0 20px 60px -12px rgba(0,0,0,.45);
}
dialog::backdrop{background:rgba(12,14,22,.5);backdrop-filter:blur(2px)}
.dlg-body{padding:18px 18px 6px}
.dlg-body h3{margin:0 0 12px;font-size:16px}
.dlg-body label{display:block;font-size:12.5px;color:var(--muted);margin:0 0 6px}
.dlg-body textarea,.dlg-body input[type=text]{
  width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card-2);
  color:var(--text);padding:10px 12px;font:inherit;font-size:15px;outline:none;resize:vertical;
}
.dlg-body textarea{min-height:130px}
.dlg-actions{display:flex;gap:8px;padding:14px 18px 18px}
.btn{
  flex:1;border:1px solid var(--line);background:var(--card-2);color:var(--text);
  border-radius:12px;padding:11px;font:inherit;font-size:14px;cursor:pointer;
}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent;font-weight:600}
.btn.danger{color:var(--danger)}
.menu-row{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  border:0;border-bottom:1px solid var(--line);background:none;color:var(--text);
  padding:14px 18px;font:inherit;font-size:14.5px;cursor:pointer;
}
.menu-row:last-child{border-bottom:0;border-radius:0 0 18px 18px}
.menu-row .em{width:20px;text-align:center}
.menu-row small{display:block;color:var(--muted);font-size:11.5px}
.toast{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);
  transform:translateX(-50%) translateY(8px);
  background:rgba(24,28,40,.94);color:#fff;padding:9px 16px;border-radius:999px;
  font-size:13px;opacity:0;pointer-events:none;transition:.22s;z-index:99;
}
.toast.on{opacity:1;transform:translateX(-50%)}

/* ---------- 番茄钟 ---------- */
#pomoBtn{min-width:52px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
#pomoBtn.live{background:rgba(255,255,255,.34)}
.pomo{display:flex;flex-direction:column;align-items:center;padding:22px 18px 4px}
.ring-wrap{position:relative;width:196px;height:196px;margin-bottom:16px}
.ring{width:196px;height:196px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.ring .bgc{stroke:var(--line)}
.ring .fg{stroke:url(#pomoGrad);transition:stroke-dashoffset .5s linear}
.ring-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.ring-mid .num{font-size:38px;font-weight:700;letter-spacing:1px;font-variant-numeric:tabular-nums}
.ring-mid .ph{font-size:12.5px;color:var(--muted)}
.pomo-modes{display:flex;gap:8px;margin-bottom:16px}
.pomo-actions{display:flex;gap:9px;width:100%;margin-bottom:14px}
.pomo-actions .btn{padding:13px 0;font-size:15px}
.pomo-stat{font-size:12.5px;color:var(--muted);text-align:center;line-height:1.9}
.switch{display:flex;align-items:center;gap:8px;justify-content:center;font-size:12.5px;color:var(--muted);padding:10px 0 2px;text-align:left}
.switch input{width:16px;height:16px;accent-color:var(--brand);flex:0 0 auto}
.pomo-custom{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:8px 0 2px}
.pomo-custom input{
  width:76px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;
  background:var(--card-2);color:var(--text);font:inherit;font-size:15px;
  text-align:center;outline:none;
}
.pomo-custom input:focus{border-color:var(--brand)}
.taskrow{width:100%;padding:0 0 8px}
.taskrow input{
  width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card-2);
  color:var(--text);padding:10px 12px;font:inherit;font-size:15px;outline:none;
}
.taskrow input:focus{border-color:var(--brand)}
.pchips{justify-content:center;padding:0 0 12px}
.ring-mid .tk{
  font-size:11px;color:var(--muted);max-width:132px;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.sched-list{max-height:46vh;overflow-y:auto;margin-top:4px}
.sess{padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.sess:last-child{border-bottom:0}
.sess .h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sess .h b{font-variant-numeric:tabular-nums}
.sess .h .du{color:var(--muted);font-size:12px}
.sess .tk2{color:var(--muted);font-size:12.5px;margin-top:3px;word-break:break-word}
.sess .day{font-size:12px;color:var(--muted);font-weight:600;margin:12px 0 2px}
.mini{
  border:1px solid var(--line);background:var(--card-2);color:var(--text);
  border-radius:10px;padding:8px 14px;font:inherit;font-size:13.5px;cursor:pointer;
}

/* ---------- 专注统计 ---------- */
.stat-body{padding:18px 18px 4px}
.stat-body h3{margin:0 0 8px;font-size:16px}
.stat-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--muted);
}
.stat-row:last-of-type{border-bottom:0}
.stat-row b{color:var(--text);font-weight:700}
.chart{display:flex;gap:6px;height:132px;margin:14px 0 4px}
.chart .col{flex:1;display:flex;flex-direction:column;height:100%;align-items:center}
.chart .v{height:15px;line-height:15px;font-size:10.5px;color:var(--muted)}
.chart .barwrap{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
.chart .bar{
  width:66%;min-height:3px;border-radius:6px 6px 3px 3px;
  background:linear-gradient(180deg,var(--brand),var(--brand-2));
}
.chart .d{height:16px;line-height:16px;font-size:10.5px;color:var(--muted)}
.chart-cap{text-align:center;font-size:11.5px;color:var(--muted);padding:2px 0 4px}
.sub-h{margin:16px 0 2px;font-size:13px;font-weight:700}

/* ---------- 番茄钟入口条 ---------- */
.pomobar{
  position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;width:100%;
  border:0;border-radius:14px;padding:13px 15px;margin-bottom:10px;cursor:pointer;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;
  box-shadow:0 8px 20px -10px rgba(91,108,255,.85);
  font:inherit;text-align:left;
}
.pomobar:active{transform:scale(.99)}
.pomobar .picon{flex:0 0 auto;font-size:21px;line-height:1}
.pomobar .ptxt{flex:1;min-width:0;font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pomobar .pmeta{flex:0 0 auto;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.3px}
.pomobar .pfill{position:absolute;left:0;bottom:0;height:3px;width:0;background:rgba(255,255,255,.85);transition:width .5s linear}
.pomobar.live{animation:pomopulse 2.6s ease-in-out infinite}
@keyframes pomopulse{
  0%,100%{box-shadow:0 8px 20px -10px rgba(91,108,255,.85)}
  50%{box-shadow:0 10px 26px -8px rgba(91,108,255,1)}
}
.pomobar.rest{background:linear-gradient(135deg,#2f9e6e,#57c99a);box-shadow:0 8px 20px -10px rgba(47,158,110,.8)}
#pomoBtn{min-width:58px;font-size:14px;font-weight:700}

/* ---------- 考试倒计时 ---------- */
.exam{
  display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:9px 12px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer;
}
.exam:active{transform:scale(.995)}
.exam .cd{flex:0 0 auto;font-size:12.5px;color:var(--muted)}
.exam .cd b{font-size:21px;font-weight:800;color:var(--brand);font-variant-numeric:tabular-nums;margin-right:3px}
.exam .ename{flex:1;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exam .go{flex:0 0 auto;font-size:11.5px;color:var(--muted)}
.exam.urgent{border-color:var(--brand);background:var(--brand-soft)}
.exam.urgent .cd b{color:var(--danger)}

/* ---------- 科目 ---------- */
.subjbar{display:flex;gap:7px;overflow-x:auto;padding:0 0 9px;scrollbar-width:none}
.subjbar::-webkit-scrollbar{display:none}
.psubj{justify-content:center;padding:0 0 12px}
.chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.chip.subj{color:var(--text)}
.badge{
  display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;white-space:nowrap;
  border:1px solid var(--line);color:var(--muted);background:var(--card-2);
}
.badge.pick{cursor:pointer}
.badge .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;vertical-align:1px}

/* ---------- 今日目标 ---------- */
.goals{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 14px;margin:12px 0 4px;box-shadow:var(--shadow);
}
.goals .gh{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.goals .gh b{font-size:13.5px}
.goals .gh .pct{flex:1;text-align:right;font-size:12px;color:var(--muted)}
.goal{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:14px;cursor:pointer}
.goal input{flex:0 0 auto;width:17px;height:17px;accent-color:var(--brand)}
.goal span.t{flex:1;word-break:break-word}
.goal span.done{color:var(--muted);text-decoration:line-through}

/* ---------- 分科横条 ---------- */
.hbar{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:12.5px;color:var(--muted)}
.hbar .n{flex:0 0 auto;width:70px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.hbar .t{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.hbar .t i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand-2))}
.hbar .m{flex:0 0 auto;width:76px;text-align:right;font-variant-numeric:tabular-nums}

#menuBtn{position:relative}
#menuBtn .thedot{
  position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;
  background:#ffcf5b;border:1.5px solid rgba(255,255,255,.9);display:none;
}
.hint{font-size:12px;color:var(--muted);line-height:1.85;margin:12px 0 0;white-space:pre-wrap}
.dlg-body select,
.dlg-body input[type=date]{
  width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card-2);
  color:var(--text);padding:10px 12px;font:inherit;font-size:15px;outline:none;
}
.dlg-body input+label{margin-top:12px}
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="bar">
      <h1>StudyBuddy<small id="subtitle">27 考研 · 倒计时 · 分科统计</small></h1>
      <button class="icon-btn" id="pomoBtn" title="番茄钟">🍅</button>
      <button class="icon-btn" id="themeBtn" title="切换深浅色">◐</button>
      <button class="icon-btn" id="menuBtn" title="更多">⋯<span class="thedot" id="bkDot"></span></button>
    </div>
    <div class="stat">
      <span>今天 <b id="stToday">0</b> 条</span>
      <span>共 <b id="stTotal">0</b> 条</span>
      <span>连续 <b id="stStreak">0</b> 天</span>
      <span>🍅 今日 <b id="stPomo">0</b> 个</span>
      <span>🎯 目标 <b id="stGoal">0/0</b></span>
    </div>
  </header>

  <div class="toolbar">
    <div class="exam" id="examStrip" title="点一下设置考试日期">
      <span class="cd"><b id="examDays">--</b>天后</span>
      <span class="ename" id="examName">27 考研初试</span>
      <span class="go">设置 ›</span>
    </div>
    <button class="pomobar" id="pomoBar" type="button">
      <span class="picon">🍅</span>
      <span class="ptxt" id="pomoBarText">开始一个番茄钟</span>
      <span class="pmeta" id="pomoBarMeta">25 分钟</span>
      <span class="pfill" id="pomoBarFill"></span>
    </button>
    <div class="search">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
      </svg>
      <input id="search" type="search" placeholder="搜索内容或标签…" autocomplete="off">
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <main id="list"></main>

  <footer>
    <div class="subjbar" id="subjBar"></div>
    <div class="crow">
      <textarea id="composer" rows="1" placeholder="记点什么… 例如：数学二 做了 30 道极限题"></textarea>
      <button id="send" disabled>发送</button>
    </div>
  </footer>
</div>

<dialog id="editDlg">
  <div class="dlg-body">
    <h3>编辑这条记录</h3>
    <textarea id="editText"></textarea>
  </div>
  <div class="dlg-actions">
    <button class="btn danger" id="editDel">删除</button>
    <button class="btn" id="editCancel">取消</button>
    <button class="btn primary" id="editSave">保存</button>
  </div>
</dialog>

<dialog id="menuDlg">
  <button class="menu-row" data-act="copyJson"><span class="em">📋</span><span>复制备份到剪贴板<small>粘到微信收藏 / 备忘录，换手机也不怕</small></span></button>
  <button class="menu-row" data-act="exportJson"><span class="em">⤓</span><span>导出 JSON 备份文件<small>完整数据，可再导入回来</small></span></button>
  <button class="menu-row" data-act="exportMd"><span class="em">📄</span><span>导出 Markdown<small>按日期分组，方便放进笔记软件</small></span></button>
  <button class="menu-row" data-act="import"><span class="em">⤒</span><span>从文件导入<small>与现有记录合并（重复的会跳过）</small></span></button>
  <button class="menu-row" data-act="pasteJson"><span class="em">📥</span><span>从剪贴板导入<small>把之前复制的备份粘回来</small></span></button>
  <button class="menu-row" data-act="sched"><span class="em">📅</span><span>完成的学习日程<small>每个番茄完成的记录，可按天复盘</small></span></button>
  <button class="menu-row" data-act="goals"><span class="em">🎯</span><span>每日目标设置<small>每天都要做的事，天天重置</small></span></button>
  <button class="menu-row" data-act="subjects"><span class="em">🏷</span><span>科目设置<small>数二 / 英二 / 政治 / 半导体物理</small></span></button>

<script>
(function(){
"use strict";

const KEY_NOTES = "studybuddy.notes.v1";
const KEY_THEME = "studybuddy.theme";
const KEY_DRAFT = "studybuddy.draft";
const KEY_EXAM = "studybuddy.exam.v1";
const KEY_SUBJ = "studybuddy.subjects.v1";
const KEY_GOALS = "studybuddy.goals.v1";
const KEY_GOALLOG = "studybuddy.goallog.v1";
const KEY_LASTSUBJ = "studybuddy.lastsubject";
const KEY_LASTBK = "studybuddy.lastbackup";
const KEY_SESS = "studybuddy.sessions.v1";
const KEY_TASKS = "studybuddy.tasks.v1";

const $ = (id) => document.getElementById(id);
const list = $("list"), chips = $("chips"), composer = $("composer"), send = $("send");
const searchEl = $("search"), toastEl = $("toast");
const editDlg = $("editDlg"), editText = $("editText");
const menuDlg = $("menuDlg"), fileInput = $("fileInput");

/* ---------------- 数据 ---------------- */
let notes = [];
let editingId = null;
let filterTag = "";
let filterSubj = "";
let query = "";
let pickSubj = "";                                       // 录入时选中的科目
let exam = { name: "27 考研初试", date: "2026-12-19" };   // 倒计时目标
let subjects = ["政治", "英语二", "数学二", "半导体物理", "其他"];
let goals = [];
let goalLog = {};                                        // { "2026-09-22": { goalId:true } }
let sessions = [];                                       // 完成的专注记录
let recentTasks = [];                                    // 最近用过的任务名

const DEFAULT_GOALS = [
  { text: "背单词 1 个 unit", subj: "英语二" },
  { text: "英语阅读 1 篇 + 精读", subj: "英语二" },
  { text: "数学二 1 章练习", subj: "数学二" },
  { text: "政治 1 讲 + 做题", subj: "政治" },
  { text: "半导体物理 1 章", subj: "半导体物理" }
];
const SUBJ_HUES = [222, 268, 340, 152, 200, 30, 300, 12];

function load(){
  try{
    const raw = localStorage.getItem(KEY_NOTES);
    notes = raw ? JSON.parse(raw) : [];
    if(!Array.isArray(notes)) notes = [];
  }catch(e){ notes = []; }
  notes.forEach(n => { if(!n.id) n.id = uid(); });
}
function persist(){
  try{ localStorage.setItem(KEY_NOTES, JSON.stringify(notes)); }
  catch(e){ toast("保存失败：本地存储已满"); }
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
function saveRaw(k, v){
  try{ localStorage.setItem(k, typeof v === "string" ? v : JSON.stringify(v)); }catch(e){}
}
function subjColor(name){
  const i = subjects.indexOf(name);
  const n = (i < 0 ? SUBJ_HUES.length - 1 : i) % SUBJ_HUES.length;
  return "hsl(" + SUBJ_HUES[n] + ",68%,58%)";
}
function loadExtra(){
  try{ const ex = JSON.parse(localStorage.getItem(KEY_EXAM) || "null"); if(ex && ex.date) exam = { name: ex.name || exam.name, date: ex.date }; }catch(e){}
  try{ const sj = JSON.parse(localStorage.getItem(KEY_SUBJ) || "null"); if(Array.isArray(sj) && sj.length) subjects = sj.filter(x => typeof x === "string"); }catch(e){}
  const mkDefaults = () => DEFAULT_GOALS.map(x => ({ id: uid(), text: x.text, subj: x.subj }));
  try{
    const g = JSON.parse(localStorage.getItem(KEY_GOALS) || "null");
    goals = (Array.isArray(g) && g.length) ? g.filter(x => x && x.text).map(x => ({ id: x.id || uid(), text: x.text, subj: x.subj || "" })) : mkDefaults();
  }catch(e){ goals = mkDefaults(); }
  try{ const gl = JSON.parse(localStorage.getItem(KEY_GOALLOG) || "null"); if(gl && typeof gl === "object") goalLog = gl; }catch(e){}
  try{
    const ss = JSON.parse(localStorage.getItem(KEY_SESS) || "null");
    sessions = Array.isArray(ss) ? ss.filter(x => x && x.minutes) : [];
  }catch(e){ sessions = []; }
  try{
    const rt = JSON.parse(localStorage.getItem(KEY_TASKS) || "null");
    recentTasks = Array.isArray(rt) ? rt.filter(x => typeof x === "string") : [];
  }catch(e){ recentTasks = []; }
  try{ pickSubj = localStorage.getItem(KEY_LASTSUBJ) || ""; }catch(e){}
}
function saveSessions(){ saveRaw(KEY_SESS, sessions); }
function rememberTask(name){
  const t = (name || "").trim();
  if(!t) return;
  recentTasks = [t].concat(recentTasks.filter(x => x !== t)).slice(0, 6);
  saveRaw(KEY_TASKS, recentTasks);
}

/* ---------------- 工具 ---------------- */
function parseTags(text){
  const out = [];
  const re = /[#＃]([^\s#＃,，、。；;:：!！?？()（）\[\]]+)/g;
  let m;
  while((m = re.exec(text)) !== null){
    const t = m[1].trim();
    if(t && !out.includes(t)) out.push(t);
  }
  return out;
}
const pad = (n) => String(n).padStart(2, "0");
const dayKey = (d) => { d = new Date(d); return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); };
const fmtTime = (iso) => { const d = new Date(iso); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
const WEEK = ["周日","周一","周二","周三","周四","周五","周六"];
function fmtDay(key){
  const today = dayKey(new Date());
  if(key === today) return "今天 · " + key.slice(5).replace("-","月") + "日";
  const y = new Date(); y.setDate(y.getDate()-1);
  if(key === dayKey(y)) return "昨天 · " + key.slice(5).replace("-","月") + "日";
  const [Y,M,D] = key.split("-").map(Number);
  const d = new Date(Y, M-1, D);
  return M + "月" + D + "日 " + WEEK[d.getDay()];
}
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("on");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toastEl.classList.remove("on"), 1900);
}
function download(name, text, type){
  const blob = new Blob([text], {type: type || "text/plain;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function stamp(){
  const d = new Date();
  return d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + "-" + pad(d.getHours()) + pad(d.getMinutes());
}

/* ---------------- 渲染 ---------------- */
function visibleNotes(){
  const q = query.trim().toLowerCase();
  return notes
    .filter(n => !filterTag || (n.tags || []).includes(filterTag))
    .filter(n => {
      if(!filterSubj) return true;
      if(filterSubj === "__none__") return !n.subj;
      return (n.subj || "") === filterSubj;
    })
    .filter(n => {
      if(!q) return true;
      return n.text.toLowerCase().includes(q) || (n.tags || []).some(t => t.toLowerCase().includes(q));
    })
    .sort((a,b) => b.createdAt.localeCompare(a.createdAt));
}
function renderChips(){
  const count = {};
  notes.forEach(n => (n.tags || []).forEach(t => count[t] = (count[t]||0)+1));
  const scount = {};
  notes.forEach(n => { const s = n.subj || ""; scount[s] = (scount[s]||0)+1; });
  const tags = Object.keys(count).sort((a,b) => count[b]-count[a]).slice(0, 20);
  chips.innerHTML = "";
  const mkChip = (label, dot, isOn, onClick) => {
    const b = document.createElement("button");
    b.className = "chip" + (dot ? " subj" : "") + (isOn ? " on" : "");
    b.innerHTML = (dot ? '<span class="dot" style="background:' + dot + '"></span>' : "") + esc(label);
    b.onclick = onClick;
    chips.appendChild(b);
  };
  mkChip("全部", "", !filterTag && !filterSubj, () => { filterTag = ""; filterSubj = ""; render(); });
  subjects.forEach(s => {
    if(!scount[s]) return;
    mkChip(s + " " + scount[s], subjColor(s), filterSubj === s, () => {
      filterSubj = (filterSubj === s) ? "" : s; filterTag = ""; render();
    });
  });
  if(scount[""]) mkChip("未分类 " + scount[""], "", filterSubj === "__none__", () => {
    filterSubj = (filterSubj === "__none__") ? "" : "__none__"; filterTag = ""; render();
  });
  tags.forEach(t => mkChip("#" + t + " " + count[t], "", filterTag === t, () => {
    filterTag = (filterTag === t) ? "" : t; filterSubj = ""; render();
  }));
}
function renderStats(){
  const today = dayKey(new Date());
  $("stToday").textContent = notes.filter(n => dayKey(n.createdAt) === today).length;
  $("stTotal").textContent = notes.length;
  // 连续记录天数
  const days = new Set(notes.map(n => dayKey(n.createdAt)));
  let streak = 0;
  const d = new Date();
  if(!days.has(dayKey(d))) d.setDate(d.getDate() - 1);   // 今天还没写，从昨天算
  while(days.has(dayKey(d))){ streak++; d.setDate(d.getDate() - 1); }
  $("stStreak").textContent = streak;
  if($("stPomo")) $("stPomo").textContent = todayPomo().count;
  if($("stGoal")){
    const gl = goalLog[today] || {};
    const gd = goals.filter(g => gl[g.id]).length;
    $("stGoal").textContent = gd + "/" + goals.length;
  }
}
function render(){
  renderStats();
  renderChips();
  renderExam();
  const arr = visibleNotes();
  list.innerHTML = "";
  if(!filterTag && !filterSubj && !query.trim()){
    const gc = document.createElement("div");
    gc.id = "goalsCard";
    gc.className = "goals";
    list.appendChild(gc);
    renderGoals();
  }
  if(!arr.length){
    const div = document.createElement("div");
    div.className = "empty";
    div.innerHTML = notes.length
      ? "<b>没有匹配的记录</b>换个关键词、科目或标签试试"
      : "<b>还没有记录</b>在下面写第一条吧<br>先点一个科目，再写内容<br>例如「做了 30 道极限题 #数学」";
    list.appendChild(div);
    return;
  }
  let lastDay = "";
  arr.forEach(n => {
    const k = dayKey(n.createdAt);
    if(k !== lastDay){
      const d = document.createElement("div");
      d.className = "day";
      d.textContent = fmtDay(k);
      list.appendChild(d);
      lastDay = k;
    }
    list.appendChild(noteEl(n));
  });
}
function noteEl(n){
  const card = document.createElement("article");
  card.className = "note";

  const p = document.createElement("p");
  p.className = "txt";
  p.textContent = n.text;
  card.appendChild(p);

  if(n.subj || (n.tags && n.tags.length)){
    const tg = document.createElement("div");
    tg.className = "tags";
    if(n.subj){
      const bd = document.createElement("button");
      bd.className = "badge pick";
      bd.title = "只看这一科";
      bd.innerHTML = '<span class="dot" style="background:' + subjColor(n.subj) + '"></span>' + esc(n.subj);
      bd.onclick = () => { filterSubj = n.subj; filterTag = ""; query = ""; searchEl.value = ""; render(); };
      tg.appendChild(bd);
    }
    (n.tags || []).forEach(t => {
      const b = document.createElement("button");
      b.className = "tag";
      b.textContent = "#" + t;
      b.onclick = () => { filterTag = t; filterSubj = ""; searchEl.value = ""; query = ""; render(); };
      tg.appendChild(b);
    });
    card.appendChild(tg);
  }

  const foot = document.createElement("div");
  foot.className = "foot";
  const time = document.createElement("span");
  time.textContent = fmtTime(n.createdAt) + (n.updatedAt ? " · 已编辑" : "");
  foot.appendChild(time);
  const sp = document.createElement("span"); sp.className = "sp"; foot.appendChild(sp);
  const copy = document.createElement("button");
  copy.className = "link"; copy.textContent = "复制";
  copy.onclick = () => {
    navigator.clipboard?.writeText(n.text).then(() => toast("已复制"), () => toast("复制失败"));
  };
  const edit = document.createElement("button");
  edit.className = "link"; edit.textContent = "编辑";
  edit.onclick = () => openEdit(n);
  foot.appendChild(copy); foot.appendChild(edit);
  card.appendChild(foot);
  return card;
}

/* ---------------- 交互 ---------------- */
function addNote(){
  const text = composer.value.trim();
  if(!text) return;
  notes.push({ id: uid(), text, tags: parseTags(text), subj: pickSubj || "", createdAt: new Date().toISOString() });
  persist();
  composer.value = "";
  composer.style.height = "auto";
  localStorage.removeItem(KEY_DRAFT);
  send.disabled = true;
  filterTag = ""; query = ""; searchEl.value = "";
  render();
  toast("已记录");
  list.scrollTop = 0;
}
function openEdit(n){
  editingId = n.id;
  editText.value = n.text;
  editDlg.showModal();
  setTimeout(() => editText.focus(), 50);
}

send.onclick = addNote;
composer.addEventListener("input", () => {
  send.disabled = !composer.value.trim();
  composer.style.height = "auto";
  composer.style.height = Math.min(composer.scrollHeight, 132) + "px";
  localStorage.setItem(KEY_DRAFT, composer.value);
});
composer.addEventListener("keydown", (e) => {
  const desktop = window.matchMedia("(hover:hover) and (pointer:fine)").matches;
  if(e.key === "Enter" && !e.shiftKey && desktop){ e.preventDefault(); addNote(); }
});
searchEl.addEventListener("input", () => { query = searchEl.value; render(); });

$("editCancel").onclick = () => editDlg.close();
$("editSave").onclick = () => {
  const n = notes.find(x => x.id === editingId);
  if(n){
    const t = editText.value.trim();
    if(!t){ toast("内容不能为空"); return; }
    n.text = t; n.tags = parseTags(t); n.updatedAt = new Date().toISOString();
    persist(); render(); toast("已保存");
  }
  editDlg.close();
};
$("editDel").onclick = () => {
  const n = notes.find(x => x.id === editingId);
  if(n && confirm("删除这条记录？不可恢复。")){
    notes = notes.filter(x => x.id !== n.id);
    persist(); render(); toast("已删除");
  }
  editDlg.close();
};

$("menuBtn").onclick = () => menuDlg.showModal();
menuDlg.addEventListener("click", (e) => {
  const row = e.target.closest(".menu-row");
  if(!row) return;
  const act = row.dataset.act;
  if(act === "copyJson"){
    copyBackup();
  } else if(act === "exportJson"){
    download("studybuddy-" + stamp() + ".json", JSON.stringify(backupPayload(), null, 2), "application/json");
    markBackup();
    toast("已导出 JSON 备份");
  } else if(act === "exportMd"){
    download("studybuddy-" + stamp() + ".md", toMarkdown(), "text/markdown;charset=utf-8");
    toast("已导出 Markdown");
  } else if(act === "pasteJson"){
    pasteImport();
  } else if(act === "sched"){
    openSched();
  } else if(act === "goals"){
    openGoals();
  } else if(act === "subjects"){
    renderSubjDlg(); $("subjDlg").showModal();
  } else if(act === "import"){
    fileInput.click();
  } else if(act === "clear"){
    if(confirm("确定清空全部 " + notes.length + " 条记录？不可恢复，建议先导出备份。") && confirm("再确认一次：真的要全部删掉吗？")){
      notes = []; persist(); filterTag = ""; query = ""; searchEl.value = ""; render(); toast("已清空");
    }
  }
  menuDlg.close();
});
fileInput.onchange = () => {
  const f = fileInput.files && fileInput.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = () => { importData(String(r.result)); fileInput.value = ""; };
  r.readAsText(f, "utf-8");
};

/* ---------------- 主题 ---------------- */
function applyTheme(mode){
  const dark = mode === "dark" || (mode === "auto" && window.matchMedia("(prefers-color-scheme:dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  document.querySelector('meta[name=theme-color]').setAttribute("content", dark ? "#101218" : "#5b6cff");
}
function initTheme(){
  let saved = null;
  try{ saved = localStorage.getItem(KEY_THEME); }catch(e){}
  applyTheme(saved || "auto");
  window.matchMedia("(prefers-color-scheme:dark)").addEventListener("change", () => {
    let cur = null; try{ cur = localStorage.getItem(KEY_THEME); }catch(e){}
    if(!cur || cur === "auto") applyTheme("auto");
  });

/* ---------------- 番茄钟 ---------------- */
const KEY_POMO = "studybuddy.pomodoro.v1";
const KEY_POMOLOG = "studybuddy.pomolog.v1";
const LONG_EVERY = 4;                 // 每完成 4 个番茄，休息一次长的

let pomoLog = {};                     // { "2026-09-21": {count, minutes} }
let pomo = { phase:"focus", focusMin:25, remainMs:25*60000, endAt:0, running:false, paused:false, cycle:0, autoLog:true, subj:"", task:"" };
let audioCtx = null;

function loadPomo(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY_POMO) || "null");
    if(s && typeof s === "object") Object.assign(pomo, s);
  }catch(e){}
  try{
    const l = JSON.parse(localStorage.getItem(KEY_POMOLOG) || "null");
    if(l && typeof l === "object") pomoLog = l;
  }catch(e){}
  if(!(pomo.remainMs > 0)) pomo.remainMs = phaseTotalMs(pomo.phase);
  if(typeof pomo.subj !== "string") pomo.subj = pickSubj || "";
  if(typeof pomo.task !== "string") pomo.task = "";
  if(typeof pomo.paused !== "boolean") pomo.paused = false;
}
function savePomo(){
  try{
    localStorage.setItem(KEY_POMO, JSON.stringify({
      phase:pomo.phase, focusMin:pomo.focusMin, remainMs:pomo.remainMs,
      endAt:pomo.endAt, running:pomo.running, paused:!!pomo.paused, cycle:pomo.cycle, autoLog:pomo.autoLog,
      subj:pomo.subj || "", task:pomo.task || ""
    }));
  }catch(e){}
}
function savePomoLog(){ try{ localStorage.setItem(KEY_POMOLOG, JSON.stringify(pomoLog)); }catch(e){} }

const phaseMinutes = (p) => p === "focus" ? pomo.focusMin : (p === "short" ? 5 : 15);
const phaseTotalMs = (p) => phaseMinutes(p) * 60000;
const phaseName = (p) => p === "focus" ? "专注" : (p === "short" ? "短休息" : "长休息");
function remainMs(){
  if(pomo.running) return Math.max(0, pomo.endAt - Date.now());
  return Math.max(0, pomo.remainMs);
}
function mmss(ms){
  const s = Math.max(0, Math.ceil(ms / 1000));
  return pad(Math.floor(s / 60)) + ":" + pad(s % 60);
}
function todayPomo(){
  const k = dayKey(new Date());
  return pomoLog[k] || {count:0, minutes:0};
}

function paintPomoBar(){
  const bar = $("pomoBar"); if(!bar) return;
  const total = phaseTotalMs(pomo.phase), left = remainMs();
  const pct = total ? Math.max(0, Math.min(1, 1 - left / total)) : 0;
  const fill = $("pomoBarFill");
  if(fill) fill.style.width = (pct * 100).toFixed(1) + "%";
  const isFocus = pomo.phase === "focus";
  bar.classList.toggle("rest", !isFocus);
  bar.classList.toggle("live", !!pomo.running);
  const started = !!pomo.running || !!pomo.paused || left < total;
  const detail = isFocus ? [(pomo.subj || ""), (pomo.task || "").trim()].filter(Boolean).join(" · ") : "";
  let state, meta;
  if(!started){
    state = isFocus ? "开始一个番茄钟" : (phaseName(pomo.phase) + " · 点开开始计时");
    meta = (isFocus ? pomo.focusMin : phaseMinutes(pomo.phase)) + " 分钟";
  }else{
    state = pomo.running ? (isFocus ? "专注中" : phaseName(pomo.phase)) : "已暂停";
    meta = mmss(left);
  }
  if($("pomoBarText")) $("pomoBarText").textContent = state + (detail ? " · " + detail : "");
  if($("pomoBarMeta")) $("pomoBarMeta").textContent = meta;
  bar.title = started ? "点击打开番茄钟（" + (pomo.running ? "进行中" : "已暂停") + "）" : "点击开始一个番茄钟";
}

function paintPomo(){
  const total = phaseTotalMs(pomo.phase), left = remainMs();
  const pct = total ? (1 - left / total) : 0;
  const ring = $("ringFg");
  if(ring) ring.style.strokeDashoffset = String(339.292 * (1 - pct));
  if($("pomoNum")) $("pomoNum").textContent = mmss(left);
  if($("pomoPhase")) $("pomoPhase").textContent = phaseName(pomo.phase);
  if($("pomoToggle")){
    $("pomoToggle").textContent = pomo.running ? "暂停" : ((pomo.paused || left < total) ? "继续" : "开始");
  }
  const btn = $("pomoBtn");
  if(btn){
    btn.textContent = pomo.running ? mmss(left) : "🍅";
    btn.classList.toggle("live", pomo.running);
    btn.title = pomo.running ? "番茄钟进行中 · " + phaseName(pomo.phase) + " " + mmss(left) : "番茄钟";
  }
  const t = todayPomo();
  if($("stPomo")) $("stPomo").textContent = t.count;
  if($("pomoStat")) $("pomoStat").textContent = "今日 " + t.count + " 个番茄 · 专注 " + t.minutes + " 分钟";
  document.querySelectorAll("#pomoModes .chip").forEach((c) => {
    c.classList.toggle("on", Number(c.dataset.min) === pomo.focusMin);
  });
  const ci = $("pomoCustom");
  if(ci && document.activeElement !== ci) ci.value = String(pomo.focusMin);
  const cb = $("pomoAutoLog");
  if(cb) cb.checked = !!pomo.autoLog;
  const ti = $("pomoTask");
  if(ti && document.activeElement !== ti) ti.value = pomo.task || "";
  const ts = $("pomoTaskShow");
  if(ts) ts.textContent = (pomo.phase === "focus" && (pomo.task || "").trim()) ? pomo.task.trim() : "";
  const rk = recentTasks.join("|");
  const rc = $("pomoRecent");
  if(rc && rc.dataset.k !== rk){ rc.dataset.k = rk; renderRecentTasks(); }
  paintPomoBar();
}

function beep(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    audioCtx = audioCtx || new Ctx();
    const t0 = audioCtx.currentTime;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "sine"; o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.22, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.9);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + 0.95);
  }catch(e){}
}
function notifyPomo(msg){
  toast(msg);
  try{ if(navigator.vibrate) navigator.vibrate([220, 90, 220]); }catch(e){}
  beep();
  try{
    if(window.Notification && Notification.permission === "granted"){
      new Notification("StudyBuddy", { body: msg });
    }
  }catch(e){}
}
function pomoStart(){
  if(pomo.running) return;
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(Ctx && !audioCtx) audioCtx = new Ctx();          // 借着用户点击解锁音频
    if(window.Notification && Notification.permission === "default") Notification.requestPermission();
  }catch(e){}
  pomo.endAt = Date.now() + Math.max(1000, pomo.remainMs);
  pomo.running = true;
  pomo.paused = false;
  savePomo(); paintPomo();
}
function pomoPause(){
  if(!pomo.running) return;
  pomo.remainMs = Math.max(0, pomo.endAt - Date.now());
  pomo.running = false;
  pomo.paused = true;
  savePomo(); paintPomo();
}
function setPhase(p){
  pomo.phase = p;
  pomo.remainMs = phaseTotalMs(p);
  pomo.running = false;
  pomo.paused = false;
  pomo.endAt = 0;
  savePomo(); paintPomo();
}
function pomoFinish(){
  const done = pomo.phase;
  pomo.running = false;
  pomo.remainMs = 0;
  if(done === "focus"){
    const k = dayKey(new Date());
    const cur = pomoLog[k] || {count:0, minutes:0};
    const sname = pomo.subj || "";
    const sub = Object.assign({}, cur.subj || {});
    const cs = sub[sname] || {count:0, minutes:0};
    sub[sname] = {count: cs.count + 1, minutes: cs.minutes + pomo.focusMin};
    pomoLog[k] = {count: cur.count + 1, minutes: cur.minutes + pomo.focusMin, subj: sub};
    savePomoLog();
    const taskName = (pomo.task || "").trim();
    const endedAt = new Date();
    sessions.push({
      id: uid(), day: k,
      start: new Date(endedAt.getTime() - pomo.focusMin * 60000).toISOString(),
      end: endedAt.toISOString(),
      minutes: pomo.focusMin, subj: sname, task: taskName
    });
    saveSessions();
    rememberTask(taskName);
    pomo.cycle = (pomo.cycle || 0) + 1;
    if(pomo.autoLog){
      const text = "🍅 " + pomo.focusMin + " 分钟专注" + (sname ? " · " + sname : "") +
                   (taskName ? " · " + taskName : "") + " #专注";
      notes.push({ id: uid(), text, tags:["专注"], subj: sname, createdAt: new Date().toISOString() });
      persist();
      render();
    }
    const next = (pomo.cycle % LONG_EVERY === 0) ? "long" : "short";
    setPhase(next);
    notifyPomo("专注完成！休息 " + phaseMinutes(next) + " 分钟");
  }else{
    setPhase("focus");
    notifyPomo("休息结束，继续加油");
  }
}
function pomoTick(){
  if(pomo.running && pomo.endAt - Date.now() <= 0){ pomoFinish(); return; }
  paintPomo();
}
/* ---- 自定义专注时长 ---- */
function applyCustomFocus(){
  const raw = Number($("pomoCustom").value);
  const v = Math.max(1, Math.min(180, Math.round(raw || 25)));
  $("pomoCustom").value = String(v);
  pomo.focusMin = v;
  if(pomo.phase === "focus"){
    if(pomo.running){ toast("已设为 " + v + " 分钟，下一个番茄生效"); }
    else { pomo.remainMs = phaseTotalMs("focus"); toast("专注时长设为 " + v + " 分钟"); }
  }else{
    toast("专注时长设为 " + v + " 分钟");
  }
  savePomo(); paintPomo();
}

/* ---- 专注时长统计 ---- */
function fmtDur(m){
  m = Math.round(m || 0);
  if(m < 60) return m + " 分钟";
  const h = Math.floor(m / 60), r = m % 60;
  return h + " 小时" + (r ? " " + r + " 分" : "");
}
function sumSince(fromKey){
  let count = 0, minutes = 0;
  for(const k in pomoLog){
    if(k >= fromKey){ count += pomoLog[k].count || 0; minutes += pomoLog[k].minutes || 0; }
  }
  return {count, minutes};
}
function sumAllPomo(){
  let count = 0, minutes = 0;
  for(const k in pomoLog){ count += pomoLog[k].count || 0; minutes += pomoLog[k].minutes || 0; }
  return {count, minutes};
}
function startOfWeekKey(){
  const d = new Date(); d.setHours(0,0,0,0);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));      // 以周一为一周开始
  return dayKey(d);
}
function startOfMonthKey(){
  const d = new Date(); d.setHours(0,0,0,0); d.setDate(1);
  return dayKey(d);
}
function renderStatDlg(){
  const rows = [
    ["今日", todayPomo()],
    ["本周", sumSince(startOfWeekKey())],
    ["本月", sumSince(startOfMonthKey())],
    ["累计", sumAllPomo()]
  ];
  $("statRows").innerHTML = rows.map((r) =>
    '<div class="stat-row"><span>' + r[0] + '</span><b>' + r[1].count + " 个 · " + fmtDur(r[1].minutes) + "</b></div>"
  ).join("");

  const days = [];
  for(let i = 6; i >= 0; i--){
    const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - i);
    const k = dayKey(d);
    days.push({ d: d, min: (pomoLog[k] && pomoLog[k].minutes) || 0 });
  }
  let max = 1;
  days.forEach((x) => { if(x.min > max) max = x.min; });
  $("statChart").innerHTML = days.map((x) => {
    const h = Math.max(3, Math.round(x.min / max * 100));
    return '<div class="col">' +
             '<div class="v">' + (x.min ? x.min : "") + '</div>' +
             '<div class="barwrap"><div class="bar" style="height:' + h + '%"></div></div>' +
             '<div class="d">' + (x.d.getMonth() + 1) + "/" + x.d.getDate() + '</div>' +
           '</div>';
  }).join("");
  renderSubjStats();
}

    if(confirm("清空全部专注统计？日志里的记录不受影响。")){
      pomoLog = {}; savePomoLog(); renderStatDlg(); paintPomo(); toast("统计已清空");
    }
  };
  document.querySelectorAll("#pomoModes .chip").forEach((c) => {

      pomo.focusMin = Number(c.dataset.min) || 25;

      savePomo(); paintPomo();
    };
  });
  if(pomo.running && pomo.endAt - Date.now() <= 0) pomoFinish();   // 关掉页面期间已经跑完
  paintPomo();
  setInterval(pomoTick, 1000);
}

/* ---------------- 导出 Markdown ---------------- */
function toMarkdown(){
  const byDay = {};
  notes.slice().sort((a,b) => a.createdAt.localeCompare(b.createdAt)).forEach(n => {
    const k = dayKey(n.createdAt);
    (byDay[k] = byDay[k] || []).push(n);
  });
  let out = "# StudyBuddy 日志\n\n导出时间：" + new Date().toLocaleString("zh-CN") + "　共 " + notes.length + " 条\n\n";
  Object.keys(byDay).sort().reverse().forEach(k => {
    out += "## " + k + "\n\n";
    byDay[k].forEach(n => {
      out += "- **" + fmtTime(n.createdAt) + "**" + (n.subj ? "【" + n.subj + "】" : "") + " " + n.text.replace(/\n/g, "  \n  ") + "\n";
    });
    out += "\n";
  });
  return out;
}

  box.querySelectorAll("button[data-si]").forEach(b => {
    b.onclick = () => {
      subjects.splice(Number(b.dataset.si), 1);
      saveRaw(KEY_SUBJ, subjects);
      renderSubjDlg(); renderSubjBar(); renderPomoSubj(); renderChips();
    };
  });
}
function addSubject(){
  const s = $("subjNew").value.trim();
  if(!s) return;
  if(subjects.includes(s)){ toast("这个科目已经有了"); return; }
  subjects.push(s);
  saveRaw(KEY_SUBJ, subjects);
  $("subjNew").value = "";
  renderSubjDlg(); renderSubjBar(); renderPomoSubj(); renderChips();
  toast("已添加科目");
}

/* ---------------- 分科统计 ---------------- */
function subjMinutes(fromKey){
  const out = {};
  for(const k in pomoLog){
    if(k < fromKey) continue;
    const sub = pomoLog[k].subj || {};
    for(const s in sub){
      const o = out[s] || {count:0, minutes:0};
      o.count += sub[s].count || 0;
      o.minutes += sub[s].minutes || 0;
      out[s] = o;
    }
  }
  return out;
}
function renderSubjStats(){
  const box = $("statSubj"); if(!box) return;
  const week = subjMinutes(startOfWeekKey());
  const keys = Object.keys(week).filter(k => week[k].minutes > 0).sort((a,b) => week[b].minutes - week[a].minutes);
  if(!keys.length){
    box.innerHTML = '<div class="stat-row"><span>本周还没有分科数据（番茄钟里选科目）</span><b>—</b></div>';
    return;
  }
  let max = 1;
  keys.forEach(k => { if(week[k].minutes > max) max = week[k].minutes; });
  box.innerHTML = keys.map(k => {
    const w = Math.max(4, Math.round(week[k].minutes / max * 100));
    return '<div class="hbar"><span class="n">' + esc(k || "未分类") + "</span>" +
           '<span class="t"><i style="width:' + w + '%"></i></span>' +
           '<span class="m">' + fmtDur(week[k].minutes) + "</span></div>";
  }).join("");
}

/* ---------------- 备份 ---------------- */
function backupPayload(){
  return { app:"StudyBuddy", version:2, exportedAt:new Date().toISOString(),
           notes, pomoLog, exam, subjects, goals, goalLog };
}
function markBackup(){ saveRaw(KEY_LASTBK, dayKey(new Date())); renderBackupTip(); }
function daysSinceBackup(){
  let last = null;
  try{ last = localStorage.getItem(KEY_LASTBK); }catch(e){}
  if(!last) return null;
  const d = new Date(last + "T00:00:00"), t = new Date(); t.setHours(0,0,0,0);
  if(isNaN(d.getTime())) return null;
  return Math.round((t - d) / 86400000);
}
function renderBackupTip(){
  const dot = $("bkDot"); if(!dot) return;
  const n = daysSinceBackup();
  const need = notes.length > 0 && (n === null || n >= 3);
  dot.style.display = need ? "block" : "none";
}
async function copyBackup(){
  const txt = JSON.stringify(backupPayload());
  try{
    await navigator.clipboard.writeText(txt);
    markBackup();
    toast("备份已复制 · 粘到微信收藏或备忘录");
  }catch(e){
    download("studybuddy-backup-" + stamp() + ".json", JSON.stringify(backupPayload(), null, 2), "application/json");
    markBackup();
    toast("剪贴板不可用，已改为下载备份文件");
  }
}
async function pasteImport(){
  try{
    const t = await navigator.clipboard.readText();
    if(!t || t.indexOf("{") < 0){ toast("剪贴板里没找到备份内容"); return; }
    importData(t);
  }catch(e){
    toast("读剪贴板被拒绝，请改用「从文件导入」");
  }
}
function mergePomoLog(incoming){
  if(!incoming || typeof incoming !== "object") return;
  for(const k in incoming){
    const a = pomoLog[k], b = incoming[k];
    if(!a){ pomoLog[k] = b; continue; }
    const out = { count: Math.max(a.count || 0, b.count || 0),
                  minutes: Math.max(a.minutes || 0, b.minutes || 0),
                  subj: Object.assign({}, a.subj || {}) };
    const bs = b.subj || {};
    for(const s in bs){
      const x = out.subj[s] || {count:0, minutes:0};
      out.subj[s] = { count: Math.max(x.count, bs[s].count || 0), minutes: Math.max(x.minutes, bs[s].minutes || 0) };
    }
    pomoLog[k] = out;
  }
  savePomoLog();
}
function importData(text){
  try{
    const data = JSON.parse(text);
    const arr = Array.isArray(data) ? data : (data.notes || []);
    const have = new Set(notes.map(n => n.text + "|" + n.createdAt));
    let added = 0;
    arr.forEach(x => {
      if(!x || typeof x.text !== "string") return;
      const createdAt = x.createdAt || new Date().toISOString();
      if(have.has(x.text + "|" + createdAt)) return;
      notes.push({ id: uid(), text: x.text, tags: (x.tags && x.tags.length) ? x.tags : parseTags(x.text),
                   subj: x.subj || "", createdAt, updatedAt: x.updatedAt || null });
      have.add(x.text + "|" + createdAt);
      added++;
    });
    if(!Array.isArray(data)){
      mergePomoLog(data.pomoLog);
      if(Array.isArray(data.subjects)){
        data.subjects.forEach(s => { if(typeof s === "string" && s && !subjects.includes(s)) subjects.push(s); });
        saveRaw(KEY_SUBJ, subjects);
      }
      if(Array.isArray(data.goals) && data.goals.length){
        const haveG = new Set(goals.map(g => g.text));
        data.goals.forEach(g => {
          if(g && g.text && !haveG.has(g.text)) goals.push({ id: uid(), text: g.text, subj: g.subj || "" });
        });
        saveRaw(KEY_GOALS, goals);
      }
      if(data.goalLog && typeof data.goalLog === "object"){
        for(const k in data.goalLog){
          goalLog[k] = Object.assign({}, goalLog[k] || {}, data.goalLog[k] || {});
        }
        saveRaw(KEY_GOALLOG, goalLog);
      }
    }
    persist();
    renderSubjBar(); renderPomoSubj(); render();
    toast("导入完成，新增 " + added + " 条记录");
  }catch(e){
    toast("导入失败：内容不是有效的备份 JSON");
  }
}
/* ---------------- 完成的学习日程 ---------------- */
function renderRecentTasks(){
  const box = $("pomoRecent"); if(!box) return;
  box.innerHTML = "";
  recentTasks.slice(0, 5).forEach(t => {
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = t;
    b.onclick = () => { pomo.task = t; savePomo(); paintPomo(); };
    box.appendChild(b);
  });
}
function schedToday(){
  const k = dayKey(new Date());
  const arr = sessions.filter(s => s.day === k);
  return { count: arr.length, minutes: arr.reduce((a, s) => a + (s.minutes || 0), 0) };
}
function schedAll(){
  return { count: sessions.length, minutes: sessions.reduce((a, s) => a + (s.minutes || 0), 0) };
}
function hhmm(iso){
  const d = new Date(iso);
  return isNaN(d.getTime()) ? "--:--" : pad(d.getHours()) + ":" + pad(d.getMinutes());
}
function renderSched(){
  if(!$("schedRows")) return;
  const t = schedToday(), all = schedAll();
  $("schedRows").innerHTML =
    '<div class="stat-row"><span>今日已完成</span><b>' + t.count + " 个 · " + fmtDur(t.minutes) + "</b></div>" +
    '<div class="stat-row"><span>累计已完成</span><b>' + all.count + " 个 · " + fmtDur(all.minutes) + "</b></div>";

  const box = $("schedList");
  if(!sessions.length){
    box.innerHTML = '<div class="sess"><div class="tk2">还没有完成的番茄。开一个番茄钟、给它起个名字，完成后这里会自动记下时间、时长和科目。</div></div>';
    return;
  }
  const byDay = {};
  sessions.forEach(s => {
    const k = s.day || dayKey(s.start || new Date());
    (byDay[k] = byDay[k] || []).push(s);
  });
  let html = "", shown = 0;
  Object.keys(byDay).sort().reverse().forEach(k => {
    if(shown >= 60) return;
    const rows = byDay[k].sort((a, b) => (b.start || "").localeCompare(a.start || ""));
    html += '<div class="day">' + fmtDay(k) + " · " + rows.length + " 个</div>";
    rows.forEach(s => {
      if(shown >= 60) return;
      shown++;
      html += '<div class="sess"><div class="h">' +
              "<b>" + hhmm(s.start) + "–" + hhmm(s.end) + "</b>" +
              '<span class="du">' + (s.minutes || 0) + " 分钟</span>" +
              (s.subj ? '<span class="badge"><span class="dot" style="background:' + subjColor(s.subj) + '"></span>' + esc(s.subj) + "</span>" : "") +
              "</div>" +
              (s.task ? '<div class="tk2">' + esc(s.task) + "</div>" : "") +
              "</div>";
    });
  });
  if(shown < sessions.length) html += '<div class="chart-cap">只显示最近 60 条，共 ' + sessions.length + " 条</div>";
  box.innerHTML = html;
}
function schedText(){
  if(!sessions.length) return "还没有完成的学习记录。";
  const byDay = {};
  sessions.forEach(s => { const k = s.day || dayKey(s.start || new Date()); (byDay[k] = byDay[k] || []).push(s); });
  let out = "StudyBuddy 完成的学习日程\n";
  Object.keys(byDay).sort().reverse().forEach(k => {
    const rows = byDay[k].sort((a, b) => (a.start || "").localeCompare(b.start || ""));
    const mins = rows.reduce((a, s) => a + (s.minutes || 0), 0);
    out += "\n【" + k + "】" + rows.length + " 个 · " + fmtDur(mins) + "\n";
    rows.forEach(s => {
      out += "  " + hhmm(s.start) + "-" + hhmm(s.end) + "  " + (s.minutes || 0) + " 分钟" +
             (s.subj ? "  " + s.subj : "") + (s.task ? "  " + s.task : "") + "\n";
    });
  });
  const a = schedAll();
  out += "\n合计：" + a.count + " 个 · " + fmtDur(a.minutes) + "\n";
  return out;
}
async function copySched(){
  const txt = schedText();
  try{ await navigator.clipboard.writeText(txt); toast("日程已复制到剪贴板"); }
  catch(e){
    download("studybuddy-schedule-" + stamp() + ".txt", txt, "text/plain;charset=utf-8");
    toast("剪贴板不可用，已改为下载文件");
  }
}
function openSched(){
  if($("pomoDlg").open) $("pomoDlg").close();
  renderSched();
  $("schedDlg").showModal();
}

function initExtra(){
  renderSubjBar(); renderPomoSubj(); renderExam(); renderBackupTip();
  $("examStrip").onclick = openExam;
  $("examSave").onclick = saveExam;
  $("examCancel").onclick = () => $("examDlg").close();
  $("goalsClose").onclick = () => { $("goalsDlg").close(); render(); };
  $("goalAdd").onclick = addGoal;
  $("goalNew").addEventListener("keydown", (e) => { if(e.key === "Enter"){ e.preventDefault(); addGoal(); } });
  $("subjClose").onclick = () => { $("subjDlg").close(); render(); };
  $("subjAdd").onclick = addSubject;
  $("subjNew").addEventListener("keydown", (e) => { if(e.key === "Enter"){ e.preventDefault(); addSubject(); } });
  $("schedClose").onclick = () => $("schedDlg").close();
  $("schedCopy").onclick = copySched;
  $("schedClear").onclick = () => {
    if(!sessions.length){ toast("本来就是空的"); return; }
    if(!confirm("清空全部学习日程记录？日志和番茄统计不受影响。")) return;
    if(!confirm("再确认一次：删除这 " + sessions.length + " 条完成记录？")) return;
    sessions = []; saveSessions(); renderSched(); toast("已清空日程");
  };
}

/* ---------------- 启动 ---------------- */
function boot(){
  initTheme();
  load();
  loadExtra();
  initPomo();
  initExtra();
  try{ const d = localStorage.getItem(KEY_DRAFT); if(d){ composer.value = d; send.disabled = false; } }catch(e){}
  render();
  const nb = daysSinceBackup();
  if(notes.length && (nb === null || nb >= 3)){
    setTimeout(() => toast("数据该备份了：⋯ → 复制备份到剪贴板"), 1200);
  }
  if("serviceWorker" in navigator && location.protocol.startsWith("http")){
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
}
boot();
})();
</script>
