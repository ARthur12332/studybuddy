/* ---------------- 番茄钟 ---------------- */
const KEY_POMO = "studybuddy.pomodoro.v1";
const KEY_POMOLOG = "studybuddy.pomolog.v1";
const LONG_EVERY = 4;                 // 每完成 4 个番茄，休息一次长的

let pomoLog = {};                     // { "2026-09-21": {count, minutes} }
let pomo = { phase:"focus", focusMin:25, remainMs:25*60000, endAt:0, running:false, paused:false, cycle:0, autoLog:true, subj:"", task:"" };
let audioCtx = null;

function loadPomo(){
  let s = null;
  try{ s = JSON.parse(localStorage.getItem(KEY_POMO) || "null"); }catch(e){ s = null; }
  /* 逐字段白名单校验，不用 Object.assign 整包盖上去：
     存储可能被改坏、或来自旧版本，phase 一旦是非法值，
     phaseTotalMs/phaseName 都会走错分支，focusMin 为负数还会算出荒谬的倒计时。 */
  if(s && typeof s === "object"){
    if(s.phase === "focus" || s.phase === "short" || s.phase === "long") pomo.phase = s.phase;
    const fm = Number(s.focusMin);
    if(isFinite(fm) && fm >= 1 && fm <= 180) pomo.focusMin = Math.round(fm);
    const rm = Number(s.remainMs);
    if(isFinite(rm) && rm >= 0) pomo.remainMs = Math.min(rm, phaseTotalMs(pomo.phase));
    const ea = Number(s.endAt);
    if(isFinite(ea) && ea > 0) pomo.endAt = ea;
    pomo.running = !!s.running;
    pomo.paused = !!s.paused;
    const cy = Number(s.cycle);
    pomo.cycle = isFinite(cy) && cy >= 0 ? Math.floor(cy) : 0;
    pomo.autoLog = s.autoLog === undefined ? true : !!s.autoLog;
    if(typeof s.subj === "string") pomo.subj = s.subj;
    if(typeof s.task === "string") pomo.task = s.task;
  }
  try{
    const l = JSON.parse(localStorage.getItem(KEY_POMOLOG) || "null");
    if(l && typeof l === "object") pomoLog = l;
  }catch(e){}
  if(!(pomo.remainMs > 0)) pomo.remainMs = phaseTotalMs(pomo.phase);
  /* 关掉页面/切到别的标签页期间已经跑完：这里直接补结算。
     以前只把它降级成「已暂停」，而调用方的结算条件是 `pomo.running && endAt 已过期`，
     降级后 running 已是 false、endAt 又被清零，两边永远对不上，
     结果这个番茄既不计入统计、也不进日程，重开页面只看到一句「已暂停」。
     pomoFinish 定义在下方（函数声明会提升），可安全调用。 */
  if(pomo.running && !(pomo.endAt > Date.now())) pomoFinish();
  else if(pomo.running && !(pomo.endAt > 0)){
    /* 运行中却压根没有 endAt：状态已不可信，降级为暂停并落盘，避免内存与存储长期打架 */
    pomo.running = false;
    pomo.paused = true;
    pomo.endAt = 0;
    savePomo();
  }
  if(typeof pomo.subj !== "string") pomo.subj = pickSubj || "";
  if(typeof pomo.task !== "string") pomo.task = "";
  if(typeof pomo.paused !== "boolean") pomo.paused = false;
}
function savePomo(){
  try{
    localStorage.setItem(KEY_POMO, JSON.stringify({
      phase:pomo.phase, focusMin:pomo.focusMin, remainMs:pomo.remainMs,
      endAt:pomo.endAt, running:pomo.running, paused:!!pomo.paused, cycle:pomo.cycle, autoLog:pomo.autoLog,
      subj:pomo.subj || "", task:pomo.task || ""
    }));
  }catch(e){}
}
function savePomoLog(){ try{ localStorage.setItem(KEY_POMOLOG, JSON.stringify(pomoLog)); }catch(e){} }

const phaseMinutes = (p) => p === "focus" ? pomo.focusMin : (p === "short" ? 5 : 15);
const phaseTotalMs = (p) => phaseMinutes(p) * 60000;
const phaseName = (p) => p === "focus" ? "专注" : (p === "short" ? "短休息" : "长休息");
function remainMs(){
  if(pomo.running) return Math.max(0, pomo.endAt - Date.now());
  return Math.max(0, pomo.remainMs);
}
function mmss(ms){
  const s = Math.max(0, Math.ceil(ms / 1000));
  return pad(Math.floor(s / 60)) + ":" + pad(s % 60);
}
function todayPomo(){
  const k = dayKey(new Date());
  return pomoLog[k] || {count:0, minutes:0};
}

function paintPomoBar(){
  const bar = $("pomoBar"); if(!bar) return;
  const total = phaseTotalMs(pomo.phase), left = remainMs();
  const pct = total ? Math.max(0, Math.min(1, 1 - left / total)) : 0;
  const fill = $("pomoBarFill");
  if(fill) fill.style.width = (pct * 100).toFixed(1) + "%";
  const isFocus = pomo.phase === "focus";
  bar.classList.toggle("rest", !isFocus);
  bar.classList.toggle("live", !!pomo.running);
  const started = !!pomo.running || !!pomo.paused || left < total;
  const detail = isFocus ? [(pomo.subj || ""), (pomo.task || "").trim()].filter(Boolean).join(" · ") : "";
  let state, meta;
  if(!started){
    state = isFocus ? "开始一个番茄钟" : (phaseName(pomo.phase) + " · 点开开始计时");
    meta = (isFocus ? pomo.focusMin : phaseMinutes(pomo.phase)) + " 分钟";
  }else{
    state = pomo.running ? (isFocus ? "专注中" : phaseName(pomo.phase)) : "已暂停";
    meta = mmss(left);
  }
  if($("pomoBarText")) $("pomoBarText").textContent = state + (detail ? " · " + detail : "");
  if($("pomoBarMeta")) $("pomoBarMeta").textContent = meta;
  bar.title = started ? "点击打开番茄钟（" + (pomo.running ? "进行中" : "已暂停") + "）" : "点击开始一个番茄钟";
  /* 运行中把倒计时写进标签页标题，切到别的窗口也能瞄到进度 */
  if(pomo.running){
    document.title = (pomo.phase === "focus" ? "🍅 " : "☕ ") + mmss(left) + " · " + phaseName(pomo.phase);
  }else if(document.title !== BASE_TITLE){
    document.title = BASE_TITLE;
  }
}

/* ---------------- 全屏倒计时 ---------------- */
let pomoFullOn = false;
let wakeLock = null;
let zenTimer = null;          // 呼出状态下的自动回隐计时器
let zenTouched = false;       // 用户是否手动点过屏幕（点过就先不自动隐藏）

/* 沉浸模式：计时中把按钮和文字淡出，只留倒计时；点屏幕再唤出 */
function setZen(on){
  const el = $("pomoFull");
  if(!el) return;
  el.classList.toggle("pf-zen", !!on);
  /* 进出沉浸态都要清掉 surfacing 标记：之前只在 setZen(true) 里清，
     用户「唤出 → 6 秒内暂停」时定时器被清、标记永久残留，底部提示点再也不显示。 */
  el.classList.remove("pf-surfacing");
  const tools = $("pfTools");
  if(tools) tools.setAttribute("aria-hidden", on ? "true" : "false");
}
function pokePomoFull(){
  /* 点屏幕：沉浸中则唤出，已唤出则淡出 */
  const el = $("pomoFull");
  if(!el || !pomo.running) return;               // 只有计时进行中才玩沉浸
  zenTouched = true;
  const isZen = el.classList.contains("pf-zen");
  clearTimeout(zenTimer);
  if(isZen){
    setZen(false);
    el.classList.add("pf-surfacing");
    zenTimer = setTimeout(() => {                // 6 秒没再操作，自动回到沉浸
      if(pomoFullOn && pomo.running && zenTouched) setZen(true);
    }, 6000);
  }else{
    setZen(true);
  }
}
function refreshZen(){
  /* 计时中默认进入沉浸；暂停或未开始时始终显示按钮 */
  const el = $("pomoFull");
  if(!el) return;
  if(!pomoFullOn){ clearTimeout(zenTimer); return; }
  if(pomo.running){
    if(!el.classList.contains("pf-zen") && !el.classList.contains("pf-surfacing")) setZen(true);
  }else{
    clearTimeout(zenTimer);
    zenTouched = false;
    el.classList.remove("pf-surfacing");     // 一起清掉，避免标记残留
    setZen(false);
  }
}

function openPomoFull(){
  if(pomoFullOn) return;
  pomoFullOn = true;
  const el = $("pomoFull");
  el.hidden = false;
  el.setAttribute("aria-hidden", "false");
  el.setAttribute("role", "dialog");
  el.setAttribute("aria-modal", "true");     // 读屏软件据此屏蔽背景内容
  el.setAttribute("aria-label", "全屏倒计时");
  document.documentElement.classList.add("pf-lock");
  const pw = $("pomoDlg");
  if(pw && pw.open) pw.close();                  // 收起小弹窗，避免两层叠着
  zenTouched = false;
  setZen(false);
  applyPfTheme();
  syncPomoFull();
  refreshZen();
  /* 全屏期间持续亮屏，别看着看着黑掉 */
  try{
    if(navigator.wakeLock && navigator.wakeLock.request){
      navigator.wakeLock.request("screen").then(l => { wakeLock = l; }).catch(() => {});
    }
  }catch(e){}
}

function closePomoFull(){
  if(!pomoFullOn) return;
  pomoFullOn = false;
  const el = $("pomoFull");
  el.hidden = true;
  el.setAttribute("aria-hidden", "true");
  document.documentElement.classList.remove("pf-lock");
  try{ if(wakeLock){ wakeLock.release(); wakeLock = null; } }catch(e){}
  releaseOrientationLock();                      // 解除方向锁定，避免残留
  /* 如果之前用了原生全屏（横屏按钮），一并退出 */
  if(document.fullscreenElement && document.exitFullscreen){
    document.exitFullscreen().catch(() => {});
  }else if(document.webkitFullscreenElement && document.webkitExitFullscreen){
    try{ document.webkitExitFullscreen(); }catch(e){}
  }
  clearTimeout(zenTimer);
  zenTouched = false;
  const pw = $("pomoDlg");
  if(pw && !pw.open) pw.showModal();            // 回到小弹窗，继续操作
  paintPomo();
}

function syncPomoFull(){
  if(!pomoFullOn) return;
  const total = phaseTotalMs(pomo.phase), left = remainMs();
  const pct = total ? Math.max(0, Math.min(1, 1 - left / total)) : 0;
  const ring = $("pfRingFg");
  if(ring) ring.style.strokeDashoffset = String(339.292 * (1 - pct));
  if($("pfNum")) $("pfNum").textContent = mmss(left);
  if($("pfPhase")) $("pfPhase").textContent = phaseName(pomo.phase);
  if($("pfToggle")) $("pfToggle").textContent = pomo.running ? "暂停" : ((pomo.paused || left < total) ? "继续" : "开始");
  const task = (pomo.task || "").trim();
  if($("pfTask")) $("pfTask").textContent = task;
  if($("pfMeta")){
    const subj = pomo.phase === "focus" ? (pomo.subj || "") : "";
    const t = todayPomo();
    const parts = [];
    if(subj) parts.push(subj);
    if(task) parts.push("本次 " + pomo.focusMin + " 分钟");
    parts.push("今日 " + t.count + " 个 · " + t.minutes + " 分钟");
    $("pfMeta").textContent = parts.join(" · ");
  }
}

/* ---- 全屏倒计时的明暗主题，跟随全局主题（复用 themeBtn 的存储键） ---- */
function applyPfTheme(){
  const btn = $("pfTheme");
  const dark = document.documentElement.dataset.theme === "dark";
  if(btn) btn.textContent = dark ? "浅色" : "深色";
  const hint = $("pfHint");
  if(hint) hint.textContent = "按 Esc 也可退出 · 点屏幕任意处可呼出按钮";
}
function togglePfTheme(){
  const dark = document.documentElement.dataset.theme === "dark";
  const next = dark ? "light" : "dark";
  try{ localStorage.setItem(KEY_THEME, next); }catch(e){}
  applyTheme(next);
  applyPfTheme();
  toast(next === "dark" ? "深色模式" : "浅色模式");
}

function toggleNativeFullscreen(){
  /* 横屏/全屏按钮：优先用原生 API 把页面推成全屏（配合系统横屏即可铺满），不支持则仅靠 CSS */
  const el = document.documentElement;
  const inFs = document.fullscreenElement || document.webkitFullscreenElement;
  try{
    if(!inFs){
      const req = el.requestFullscreen || el.webkitRequestFullscreen;
      if(req){
        const p = req.call(el);
        if(p && p.catch) p.catch(() => {});
      }
      if(screen.orientation && screen.orientation.lock){
        const lp = screen.orientation.lock("landscape");
        if(lp && lp.catch) lp.catch(() => {});
      }
    }else{
      if(document.exitFullscreen) document.exitFullscreen().catch(() => {});
      else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  }catch(e){}
}

/* 退出全屏时解除屏幕方向锁定：Android 上 exitFullscreen 不保证连带解锁，会残留 */
function releaseOrientationLock(){
  try{
    if(screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
  }catch(e){}
}

function initPomoFull(){
  const wrap = $("pomoRingWrap");
  if(wrap){
    wrap.onclick = () => openPomoFull();
    wrap.addEventListener("keydown", (e) => {
      if(e.key === "Enter" || e.key === " "){ e.preventDefault(); openPomoFull(); }
    });
  }
  if($("pfExit")) $("pfExit").onclick = closePomoFull;
  if($("pfFullApi")) $("pfFullApi").onclick = toggleNativeFullscreen;
  if($("pfTheme")) $("pfTheme").onclick = togglePfTheme;
  if($("pfToggle")){
    /* zen 状态完全由 pomoStart/pomoPause 内部统一处理，这里只防止冒泡触发「点屏幕」逻辑 */
    $("pfToggle").onclick = (e) => { e.stopPropagation(); pomo.running ? pomoPause() : pomoStart(); };
  }
  if($("pfSkip")) $("pfSkip").onclick = (e) => {
    e.stopPropagation();
    if(pomo.phase === "focus" && (pomo.running || pomo.paused) && !confirm("跳过这轮专注？本轮不会计入统计。")) return;
    setPhase(pomo.phase === "focus" ? "short" : "focus");
    syncPomoFull();
  };
  /* 点屏幕空白处：沉浸 ↔ 呼出按钮（点在按钮/圆环上不触发） */
  const full = $("pomoFull");
  if(full){
    full.addEventListener("click", (e) => {
      if(e.target.closest("button")) return;
      pokePomoFull();
    });
  }
  document.addEventListener("keydown", (e) => {
    if(!pomoFullOn) return;
    if(e.key === "Escape"){ e.preventDefault(); closePomoFull(); }
    else if(e.key === " "){ e.preventDefault(); pomo.running ? pomoPause() : pomoStart(); }
    else if(e.key === "t" || e.key === "T"){ togglePfTheme(); }
  });
  window.addEventListener("orientationchange", () => setTimeout(syncPomoFull, 120));
}

function paintPomo(){
  const total = phaseTotalMs(pomo.phase), left = remainMs();
  const pct = total ? (1 - left / total) : 0;
  const ring = $("ringFg");
  if(ring) ring.style.strokeDashoffset = String(339.292 * (1 - pct));
  if($("pomoNum")) $("pomoNum").textContent = mmss(left);
  if($("pomoPhase")) $("pomoPhase").textContent = phaseName(pomo.phase);
  if($("pomoToggle")){
    $("pomoToggle").textContent = pomo.running ? "暂停" : ((pomo.paused || left < total) ? "继续" : "开始");
  }
  const rw = $("pomoRingWrap");
  if(rw) rw.classList.toggle("live", !!(pomo.running || pomo.paused || left < total));
  if($("zoomTip")) $("zoomTip").textContent = (pomo.running || pomo.paused || left < total) ? "点击放大倒计时 ⤢" : "点击放大 ⤢";
  const t = todayPomo();
  if($("stPomo")) $("stPomo").textContent = t.count;
  if($("pomoStat")) $("pomoStat").textContent = "今日 " + t.count + " 个番茄 · 专注 " + t.minutes + " 分钟";
  document.querySelectorAll("#pomoModes .chip").forEach((c) => {
    c.classList.toggle("on", Number(c.dataset.min) === pomo.focusMin);
  });
  const ci = $("pomoCustom");
  if(ci && document.activeElement !== ci) ci.value = String(pomo.focusMin);
  const cb = $("pomoAutoLog");
  if(cb) cb.checked = !!pomo.autoLog;
  const ti = $("pomoTask");
  if(ti && document.activeElement !== ti) ti.value = pomo.task || "";
  const ts = $("pomoTaskShow");
  if(ts) ts.textContent = (pomo.phase === "focus" && (pomo.task || "").trim()) ? pomo.task.trim() : "";
  const rk = recentTasks.join("|");
  const rc = $("pomoRecent");
  if(rc && rc.dataset.k !== rk){ rc.dataset.k = rk; renderRecentTasks(); }
  paintPomoBar();
  syncPomoFull();
}

function beep(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    audioCtx = audioCtx || new Ctx();
    /* iOS 从后台切回来 AudioContext 常处于 suspended，先唤醒再响，否则提醒静音 */
    if(audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
    const t0 = audioCtx.currentTime;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "sine"; o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.22, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.9);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + 0.95);
  }catch(e){}
}
function notifyPomo(msg){
  toast(msg);
  try{ if(navigator.vibrate) navigator.vibrate([220, 90, 220]); }catch(e){}
  beep();
  try{
    if(window.Notification && Notification.permission === "granted"){
      new Notification("StudyBuddy", { body: msg });
    }
  }catch(e){}
}
function pomoStart(){
  if(pomo.running) return;
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(Ctx && !audioCtx) audioCtx = new Ctx();          // 借着用户点击解锁音频
    if(audioCtx && audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
    if(window.Notification && Notification.permission === "default") Notification.requestPermission();
  }catch(e){}
  pomo.endAt = Date.now() + Math.max(1000, pomo.remainMs);
  pomo.running = true;
  pomo.paused = false;
  savePomo(); paintPomo();
  if(pomoFullOn){ zenTouched = false; setZen(true); }   // 全屏下开始即进沉浸
}
function pomoPause(){
  if(!pomo.running) return;
  pomo.remainMs = Math.max(0, pomo.endAt - Date.now());
  pomo.running = false;
  pomo.paused = true;
  savePomo(); paintPomo();
  if(pomoFullOn){ clearTimeout(zenTimer); zenTouched = false; setZen(false); }  // 暂停时把按钮放出来
}
function setPhase(p){
  pomo.phase = p;
  pomo.remainMs = phaseTotalMs(p);
  pomo.running = false;
  pomo.paused = false;
  pomo.endAt = 0;
  savePomo(); paintPomo(); syncPomoFull();
  if(pomoFullOn){ clearTimeout(zenTimer); zenTouched = false; setZen(false); }
}
function pomoFinish(){
  const done = pomo.phase;
  pomo.running = false;
  pomo.remainMs = 0;
  if(done === "focus"){
    /* 用「本轮实际结束时间」而不是「现在」归属日期：
       跨零点后台跑完、第二天才打开页面补结算时，记到当天才是对的。 */
    const scheduledEnd = pomo.endAt ? new Date(pomo.endAt) : null;
    const endedAt = (scheduledEnd && !isNaN(scheduledEnd.getTime()) && scheduledEnd <= new Date())
                    ? scheduledEnd : new Date();
    const k = dayKey(endedAt);
    const cur = pomoLog[k] || {count:0, minutes:0};
    const sname = pomo.subj || "";
    const sub = Object.assign({}, cur.subj || {});
    const cs = sub[sname] || {count:0, minutes:0};
    sub[sname] = {count: cs.count + 1, minutes: cs.minutes + pomo.focusMin};
    pomoLog[k] = {count: cur.count + 1, minutes: cur.minutes + pomo.focusMin, subj: sub};
    savePomoLog();
    const taskName = (pomo.task || "").trim();
    sessions.push({
      id: uid(), day: k,
      start: new Date(endedAt.getTime() - pomo.focusMin * 60000).toISOString(),
      end: endedAt.toISOString(),
      minutes: pomo.focusMin, subj: sname, task: taskName
    });
    saveSessions();
    archiveSessions();                                    // 超出保留上限的最旧日程自动归档
    rememberTask(taskName);
    pomo.cycle = (pomo.cycle || 0) + 1;
    if(pomo.autoLog){
      const text = "🍅 " + pomo.focusMin + " 分钟专注" + (sname ? " · " + sname : "") +
                   (taskName ? " · " + taskName : "") + " #专注";
      notes.push(normalizeNote({ text: text, tags: ["专注"], subj: sname, createdAt: endedAt.toISOString() }));
      persist();
      render();
    }
    const next = (pomo.cycle % LONG_EVERY === 0) ? "long" : "short";
    setPhase(next);
    notifyPomo("专注完成！休息 " + phaseMinutes(next) + " 分钟");
  }else{
    setPhase("focus");
    notifyPomo("休息结束，继续加油");
  }
}
let tickIdle = 0;
function pomoTick(){
  /* 1) 先结算：跑完了就补，并把跨天视图一起刷新 */
  if(pomo.running && pomo.endAt - Date.now() <= 0){ pomoFinish(); tickPomoCross(); return; }
  /* 2) 有在动（计时中 / 弹窗开着 / 全屏中）→ 每秒重绘；跨天时也顺带刷一眼 */
  if(pomo.running || ($("pomoDlg") && $("pomoDlg").open) || pomoFullOn){
    paintPomo();
    tickPomoCross();
    return;
  }
  /* 3) 全空闲 → 降到 30 秒一拍。
     这里原来是 `else if(++tickIdle >= 30)`，但 tickIdle 只在空闲时才自增，
     永远不可能有别的分支把它推上去，那个 else if 等价于 else，纯属多余判断。
     改成显式提前 return 的平铺结构，顺带让「空闲态也要查跨天」这件事一眼可见。 */
  if(++tickIdle < 30) return;
  tickIdle = 0;
  renderStats(); paintPomoBar(); tickPomoCross();
}
/* 跨天守卫：这两个「只读当天」的视图不会因为时间流逝自动更新，
   页面连着开一整夜时，昨晚的今日目标会一直停在已完成状态、番茄条也停在昨天。
   成本极低——只有 dayKey 真的变了才重画，且只在页面可见时跑。 */
let lastTickDay = "";
function tickPomoCross(){
  if(document.hidden) return;
  const k = dayKey(new Date());
  if(!lastTickDay){ lastTickDay = k; return; }
  if(k === lastTickDay) return;
  lastTickDay = k;
  renderGoals();                                          // 新的一天，勾选状态归零
  paintPomoBar();
}
/* ---- 自定义专注时长 ---- */
function applyCustomFocus(){
  const raw = Number($("pomoCustom").value);
  const v = Math.max(1, Math.min(180, Math.round(raw || 25)));
  $("pomoCustom").value = String(v);
  pomo.focusMin = v;
  if(pomo.phase === "focus"){
    if(pomo.running){ toast("已设为 " + v + " 分钟，下一个番茄生效"); }
    else { pomo.remainMs = phaseTotalMs("focus"); toast("专注时长设为 " + v + " 分钟"); }
  }else{
    toast("专注时长设为 " + v + " 分钟");
  }
  savePomo(); paintPomo();
}

/* ---- 专注时长统计 ---- */
function fmtDur(m){
  m = Math.round(m || 0);
  if(m < 60) return m + " 分钟";
  const h = Math.floor(m / 60), r = m % 60;
  return h + " 小时" + (r ? " " + r + " 分" : "");
}
function sumSince(fromKey){
  let count = 0, minutes = 0;
  for(const k in pomoLog){
    if(k >= fromKey){ count += pomoLog[k].count || 0; minutes += pomoLog[k].minutes || 0; }
  }
  return {count, minutes};
}
function sumAllPomo(){
  let count = 0, minutes = 0;
  for(const k in pomoLog){ count += pomoLog[k].count || 0; minutes += pomoLog[k].minutes || 0; }
  return {count, minutes};
}
function startOfWeekKey(){
  const d = new Date(); d.setHours(0,0,0,0);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));      // 以周一为一周开始
  return dayKey(d);
}
function startOfMonthKey(){
  const d = new Date(); d.setHours(0,0,0,0); d.setDate(1);
  return dayKey(d);
}
/* ---- 趋势：按周/按天聚合（图表全部用原生 DOM + SVG，不引图表库）---- */
/* 返回某一周的 7 个 dayKey：offsetWeeks=0 是本周，-1 是上周，周一为一周之始 */
function weekDays(offsetWeeks){
  const d = new Date(); d.setHours(0,0,0,0);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7) + offsetWeeks * 7);
  const out = [];
  for(let i = 0; i < 7; i++){
    const x = new Date(d); x.setDate(d.getDate() + i);
    out.push(dayKey(x));
  }
  return out;
}
const dayMinutes = (k) => (pomoLog[k] && pomoLog[k].minutes) || 0;
function sumKeys(keys){
  let count = 0, minutes = 0;
  keys.forEach(k => {
    const v = pomoLog[k];
    if(v){ count += v.count || 0; minutes += v.minutes || 0; }
  });
  return { count: count, minutes: minutes };
}
function subjMinutesKeys(keys){
  const out = {};
  keys.forEach(k => {
    const v = pomoLog[k]; if(!v) return;
    const sub = v.subj || {};
    for(const s in sub){
      const o = out[s] || { count: 0, minutes: 0 };
      o.count += sub[s].count || 0;
      o.minutes += sub[s].minutes || 0;
      out[s] = o;
    }
  });
  return out;
}
/* 上周为 0 时不做除法：直接按「有/无」给 100% 或 0%，避免出现 Infinity% */
function pctDelta(cur, prev){
  if(!prev) return cur ? 100 : 0;
  return Math.round((cur - prev) / prev * 100);
}
function deltaHtml(d){
  if(!d) return '<span class="delta">持平</span>';
  return '<span class="delta ' + (d > 0 ? "up" : "down") + '">' + (d > 0 ? "↑" : "↓") + Math.abs(d) + "%</span>";
}
/* 7 天双折线：本周实线、上周虚线，同一条横轴（周一→周日）便于直接比高低 */
function sparkSvg(cur7, prev7){
  const W = 300, H = 96, PL = 22, PR = 8, PT = 10, PB = 16;
  let max = 1;
  cur7.concat(prev7).forEach(v => { if(v > max) max = v; });
  const xs = (i) => PL + i * (W - PL - PR) / 6;
  const ys = (v) => PT + (1 - v / max) * (H - PT - PB);
  const pts = (a) => a.map((v, i) => xs(i) + "," + ys(v)).join(" ");
  let s = '<svg class="spark" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="本周与上周每日专注时长对比曲线">';
  [0, 0.5, 1].forEach(t => {
    const y = PT + t * (H - PT - PB);
    s += '<line class="axis" x1="' + PL + '" y1="' + y + '" x2="' + (W - PR) + '" y2="' + y + '"/>';
  });
  s += '<text class="yl" x="' + (PL - 5) + '" y="' + (PT + 3) + '" text-anchor="end">' + max + "</text>";
  s += '<text class="yl" x="' + (PL - 5) + '" y="' + (H - PB + 3) + '" text-anchor="end">0</text>';
  s += '<polyline class="prev" points="' + pts(prev7) + '"/>';
  s += '<polyline class="cur" points="' + pts(cur7) + '"/>';
  cur7.forEach((v, i) => { s += '<circle class="pt" cx="' + xs(i) + '" cy="' + ys(v) + '" r="2.6"/>'; });
  ["一","二","三","四","五","六","日"].forEach((t, i) => {
    s += '<text class="xl" x="' + xs(i) + '" y="' + (H - 3) + '" text-anchor="middle">' + t + "</text>";
  });
  return s + "</svg>";
}
function renderWow(){
  const box = $("statWow"); if(!box) return;
  const cur = sumKeys(weekDays(0)), prev = sumKeys(weekDays(-1));
  /* 两周都是 0：别画一条贴着底边的直线，直接给一句人话 */
  if(!cur.minutes && !prev.minutes){
    box.innerHTML = '<div class="stat-row"><span>这周和上周都还没有专注记录，开一个番茄钟试试</span><b>—</b></div>';
    return;
  }
  const dMin = pctDelta(cur.minutes, prev.minutes), dCnt = pctDelta(cur.count, prev.count);
  box.innerHTML =
    '<div class="wow">' +
      '<div class="cell"><div class="k">本周专注</div><div class="v">' + fmtDur(cur.minutes) + "</div>" +
        '<div class="s">' + cur.count + " 个番茄 · 比上周 " + deltaHtml(dMin) + "</div></div>" +
      '<div class="cell"><div class="k">上周专注</div><div class="v">' + fmtDur(prev.minutes) + "</div>" +
        '<div class="s">' + prev.count + " 个番茄 · 番茄数 " + deltaHtml(dCnt) + "</div></div>" +
    "</div>" +
    sparkSvg(weekDays(0).map(dayMinutes), weekDays(-1).map(dayMinutes)) +
    '<div class="spark-legend"><span><i></i>本周</span><span><i class="dash"></i>上周</span></div>';
}
/* 科目占比环形图：conic-gradient 画环 + 图例，纯 CSS，不用 canvas/SVG 库 */
function renderDonut(){
  const box = $("statDonut"); if(!box) return;
  const week = subjMinutesKeys(weekDays(0));
  const keys = Object.keys(week).filter(k => week[k].minutes > 0).sort((a, b) => week[b].minutes - week[a].minutes);
  const total = keys.reduce((s, k) => s + week[k].minutes, 0);
  if(!total){
    box.innerHTML = '<div class="stat-row"><span>本周还没有分科数据（番茄钟里选个科目再开始）</span><b>—</b></div>';
    return;
  }
  let acc = 0;
  const segs = keys.map(k => {
    const p = week[k].minutes / total * 100;
    const seg = subjColor(k) + " " + acc.toFixed(2) + "% " + (acc + p).toFixed(2) + "%";
    acc += p;
    return seg;
  });
  box.innerHTML =
    '<div class="donut-wrap">' +
      '<div class="donut" style="background:conic-gradient(from -90deg,' + segs.join(",") + ')">' +
        '<div class="dmid"><b>' + fmtDur(total) + "</b>本周合计</div>" +
      "</div>" +
      '<div class="legend">' + keys.map(k =>
        '<div class="li"><i style="background:' + subjColor(k) + '"></i>' +
        '<span class="ln">' + esc(k || "未分类") + "</span>" +
        '<span class="lv">' + Math.round(week[k].minutes / total * 100) + "% · " + week[k].minutes + " 分</span></div>"
      ).join("") + "</div>" +
    "</div>";
}
function renderStatDlg(){
  const rows = [
    ["今日", todayPomo()],
    ["本周", sumKeys(weekDays(0))],
    ["本月", sumSince(startOfMonthKey())],
    ["累计", sumAllPomo()]
  ];
  $("statRows").innerHTML = rows.map((r) =>
    '<div class="stat-row"><span>' + r[0] + '</span><b>' + r[1].count + " 个 · " + fmtDur(r[1].minutes) + "</b></div>"
  ).join("");

  renderWow();
  renderDonut();

  const days = [];
  for(let i = 6; i >= 0; i--){
    const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - i);
    const k = dayKey(d);
    days.push({ d: d, min: (pomoLog[k] && pomoLog[k].minutes) || 0 });
  }
  let max = 1;
  days.forEach((x) => { if(x.min > max) max = x.min; });
  $("statChart").innerHTML = days.map((x) => {
    const h = Math.max(3, Math.round(x.min / max * 100));
    return '<div class="col">' +
             '<div class="v">' + (x.min ? x.min : "") + '</div>' +
             '<div class="barwrap"><div class="bar" style="height:' + h + '%"></div></div>' +
             '<div class="d">' + (x.d.getMonth() + 1) + "/" + x.d.getDate() + '</div>' +
           '</div>';
  }).join("");
  renderSubjStats();
}

function initPomo(){
  loadPomo();
  const open = () => { paintPomo(); if(!$("pomoDlg").open) $("pomoDlg").showModal(); };
  if($("pomoBar")) $("pomoBar").onclick = open;
  initPomoFull();
  $("pomoToggle").onclick = () => { pomo.running ? pomoPause() : pomoStart(); };
  $("pomoReset").onclick = () => {
    if((pomo.running || pomo.paused) && !confirm("重置当前" + phaseName(pomo.phase) + "？进度将清零。")) return;
    setPhase(pomo.phase); toast("已重置");
  };
  $("pomoSkip").onclick = () => {
    if(pomo.phase === "focus" && (pomo.running || pomo.paused) && !confirm("跳过这轮专注？本轮不会计入统计。")) return;
    setPhase(pomo.phase === "focus" ? "short" : "focus");
  };
  $("pomoClose").onclick = () => $("pomoDlg").close();
  $("pomoAutoLog").onchange = (e) => { pomo.autoLog = !!e.target.checked; savePomo(); };
  $("pomoCustomSet").onclick = applyCustomFocus;
  $("pomoCustom").addEventListener("keydown", (e) => {
    if(e.key === "Enter"){ e.preventDefault(); applyCustomFocus(); }
  });
  $("pomoStats").onclick = () => {
    if($("pomoDlg").open) $("pomoDlg").close();
    renderStatDlg();
    $("statDlg").showModal();
  };
  $("pomoSched").onclick = openSched;
  $("pomoTask").addEventListener("input", (e) => { pomo.task = e.target.value; savePomo(); paintPomo(); });
  $("statClose").onclick = () => $("statDlg").close();
  $("statClear").onclick = () => {
    if(confirm("清空全部专注统计？日志里的记录不受影响。")){
      pomoLog = {}; savePomoLog(); renderStatDlg(); paintPomo(); toast("统计已清空");
    }
  };
  document.querySelectorAll("#pomoModes .chip").forEach((c) => {
    c.onclick = () => {
      const v = Number(c.dataset.min) || 25;
      if(v === pomo.focusMin) return;
      pomo.focusMin = v;
      $("pomoCustom").value = String(v);
      if(pomo.phase === "focus"){
        if(pomo.running){ toast("已切换为 " + v + " 分钟，下一个番茄生效"); }   // 与自定义时长一致：不打断进行中的计时
        else { pomo.remainMs = phaseTotalMs("focus"); }
      }
      savePomo(); paintPomo();
    };
  });
  /* 结算已在 loadPomo() 里做了（它会直接调 pomoFinish），这里只负责首屏渲染 */
  paintPomo();
  setInterval(pomoTick, 1000);
}

/* ---------------- 导出 Markdown ---------------- */
function toMarkdown(){
  const byDay = {};
  /* 与列表一致：先算数值时间戳再比。localeCompare 受当前 locale 影响、不保证与字典序一致 */
  const ts = (n) => new Date(n.createdAt).getTime() || 0;
  notes.slice().sort((a, b) => ts(a) - ts(b)).forEach(n => {
    const k = dayKey(n.createdAt);
    (byDay[k] = byDay[k] || []).push(n);
  });
  let out = "# StudyBuddy 日志\n\n导出时间：" + new Date().toLocaleString("zh-CN") + "　共 " + notes.length + " 条\n\n";
  Object.keys(byDay).sort().reverse().forEach(k => {
    out += "## " + k + "\n\n";
    byDay[k].forEach(n => {
      out += "- **" + fmtTime(n.createdAt) + "**" + (n.subj ? "【" + n.subj + "】" : "") + " " + n.text.replace(/\n/g, "  \n  ") + "\n";
    });
    out += "\n";
  });
  return out;
}

/* ---------------- 考试倒计时 ---------------- */
function examDaysLeft(){
  if(!exam.date) return null;
  const t = new Date(); t.setHours(0,0,0,0);
  const d = new Date(exam.date + "T00:00:00");
  if(isNaN(d.getTime())) return null;
  return Math.round((d - t) / 86400000);
}
function renderExam(){
  const el = $("examStrip"); if(!el || !$("examName") || !$("examDays")) return;
  const left = examDaysLeft();
  $("examDays").textContent = left === null ? "--" : String(Math.abs(left));
  if(left === null) $("examName").textContent = exam.name + "（未设置日期）";
  else if(left === 0) $("examName").textContent = "今天就考，加油！";
  else if(left > 0) $("examName").textContent = exam.name + " · " + exam.date.slice(5).replace("-", "/");
  else $("examName").textContent = exam.name + " · 已考完 " + Math.abs(left) + " 天";
  el.classList.toggle("urgent", left !== null && left <= 100);
}
const EXAM_NODES =
  "关键节点（预估，以教育部 / 研招网公告为准）\n" +
  "· 9 月下旬：招生简章、大纲、网上咨询周\n" +

function saveExam(){
  const n = $("examNameIn").value.trim() || "考研初试";
  const d = $("examDateIn").value;

/* ---------------- 每日目标 ---------------- */
/* goalLog 按天累积且只被「今天」消费，历史日期永远不会再读。
   不清理的话键会一年年堆积、备份文件也跟着变大，所以保留最近 GOALLOG_KEEP 天即可。 */
const GOALLOG_KEEP = 60;
function pruneGoalLog(){
  const keys = Object.keys(goalLog).sort();
  if(keys.length <= GOALLOG_KEEP) return;
  /* 反正只读当天，直接砍掉最早的那批（日期是 YYYY-MM-DD，字典序即时间序） */
  const drop = keys.slice(0, keys.length - GOALLOG_KEEP);
  let changed = false;
  drop.forEach(k => { if(goalLog[k] !== undefined){ delete goalLog[k]; changed = true; } });
  if(changed) saveRaw(KEY_GOALLOG, goalLog);
}
function goalsOfDay(){
  const k = dayKey(new Date());
  if(!goalLog[k]) goalLog[k] = {};
  return goalLog[k];
}
function renderGoals(){
  const wrap = $("goalsCard"); if(!wrap) return;
  if(!goals.length){
    wrap.innerHTML = '<div class="gh"><b>今日目标</b><span class="pct">还没设置</span>' +
                     '<button class="link" data-gact="open">去设置</button></div>';
  }else{
    const m = goalsOfDay();
    const done = goals.filter(g => m[g.id]).length;
    wrap.innerHTML = '<div class="gh"><b>今日目标</b><span class="pct">' + done + " / " + goals.length +
                     " · " + Math.round(done / goals.length * 100) + '%</span>' +
                     '<button class="link" data-gact="open">编辑</button></div>' +
      goals.map(g =>
        '<label class="goal"><input type="checkbox" data-gid="' + esc(g.id) + '"' + (m[g.id] ? " checked" : "") + ">" +
        '<span class="t' + (m[g.id] ? " done" : "") + '">' + esc(g.text) + "</span>" +
        (g.subj ? '<span class="badge"><span class="dot" style="background:' + subjColor(g.subj) + '"></span>' + esc(g.subj) + "</span>" : "") +
        "</label>").join("");
    wrap.querySelectorAll("input[data-gid]").forEach(cb => {
      cb.onchange = () => toggleGoal(cb.dataset.gid);
    });
  }
  const btn = wrap.querySelector('button[data-gact="open"]');
  if(btn) btn.onclick = openGoals;
}
function toggleGoal(id){
  const m = goalsOfDay();
  if(m[id]) delete m[id]; else m[id] = true;
  saveRaw(KEY_GOALLOG, goalLog);
  renderGoals(); renderStats();
  if(goals.length && goals.every(g => m[g.id])) toast("今日目标全部完成，厉害！");
}
function openGoals(){ renderGoalsDlg(); $("goalsDlg").showModal(); }
function renderGoalsDlg(){
  const box = $("goalList"); if(!box) return;
  box.innerHTML = goals.length ? goals.map((g, i) =>
    '<div class="stat-row"><span>' + esc(g.text) +
    (g.subj ? ' <span class="badge">' + esc(g.subj) + "</span>" : "") +
    '</span><button class="link" data-di="' + i + '">删除</button></div>').join("")
    : '<div class="stat-row"><span>还没有目标，下面加一条</span></div>';
  const sel = $("goalSubjSel");
  if(sel){
    sel.innerHTML = '<option value="">（不指定科目）</option>' +
      subjects.map(s => '<option value="' + esc(s) + '">' + esc(s) + "</option>").join("");
  }
  box.querySelectorAll("button[data-di]").forEach(b => {
    b.onclick = () => {
      /* 连打卡记录一起清掉：goalLog 只按天累积、不会因为目标被删而回收，
         不清的话会留下一批永远匹配不上任何目标、却要占满 60 天配额的孤儿键，
         甚至把真正在用的日期挤出保留窗口。 */
      const gone = goals.splice(Number(b.dataset.di), 1)[0];
      if(gone){
        let touched = false;
        for(const k in goalLog){
          if(goalLog[k] && goalLog[k][gone.id] !== undefined){ delete goalLog[k][gone.id]; touched = true; }
        }
        if(touched) saveRaw(KEY_GOALLOG, goalLog);
      }
      saveRaw(KEY_GOALS, goals);
      renderGoalsDlg(); renderGoals(); renderStats();
    };
  });
}
function addGoal(){
  const t = $("goalNew").value.trim();
  if(!t){ toast("先写点内容"); return; }
  if(t.length > 60){ toast("目标太长了，请控制在 60 字以内"); return; }
  if(goals.length >= 30){ toast("目标太多了，先删掉一些吧"); return; }
  goals.push({ id: uid(), text: t, subj: $("goalSubjSel") ? $("goalSubjSel").value : "" });
  saveRaw(KEY_GOALS, goals);
  $("goalNew").value = "";
  renderGoalsDlg(); renderGoals(); renderStats();   // 顶部「目标 N/M」计数也要跟着刷新
  toast("已添加");
}

/* ---------------- 科目 ---------------- */
/* 科目 chip 条通用渲染：录入栏与番茄钟共用一套逻辑 */
function mkSubjChips(barId, current, onPick){
  const bar = $(barId); if(!bar) return;
  bar.innerHTML = "";
  const mk = (label, value, color) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip subj" + (current() === value ? " on" : "");
    b.innerHTML = (color ? '<span class="dot" style="background:' + color + '"></span>' : "") + esc(label);
    b.onclick = () => onPick(value);
    bar.appendChild(b);
  };
  subjects.forEach(s => mk(s, s, subjColor(s)));
  mk("未分类", "", "");
}
function renderSubjBar(){
  mkSubjChips("subjBar",
    () => pickSubj,
    (v) => { pickSubj = v; saveRaw(KEY_LASTSUBJ, v); renderSubjBar(); renderPomoSubj(); });
}
function renderPomoSubj(){
  mkSubjChips("pomoSubj",
    () => pomo.subj || "",
    (v) => { pomo.subj = v; savePomo(); renderPomoSubj(); });
}
function renderSubjDlg(){
  const box = $("subjList"); if(!box) return;
  box.innerHTML = subjects.map((s, i) =>
    '<div class="stat-row"><span><span class="dot" style="background:' + subjColor(s) +
    ';display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px"></span>' + esc(s) + "</span>" +
    '<button class="link" data-si="' + i + '">删除</button></div>').join("") ||
    '<div class="stat-row"><span>还没有科目</span></div>';
  box.querySelectorAll("button[data-si]").forEach(b => {
    b.onclick = () => {
      const i = Number(b.dataset.si);
      const s = subjects[i];
      if(s == null) return;
      /* 删除科目时处理关联笔记，避免既筛不出来也不算未分类的“幽灵笔记”。
         这里用三选一弹窗，而不是 confirm —— confirm 的「取消」语义会让人误以为「不删了」，
         但它实际上是「删掉、只是笔记保留原标记」。 */
      const cnt = notes.filter(n => (n.subj || "") === s).length;
      if(cnt === 0){ doDeleteSubject(i, false); return; }
      askDeleteSubject(i, s, cnt);
    };
  });
}
let pendingDelSubj = null;
function askDeleteSubject(i, name, cnt){
  pendingDelSubj = { i: i, name: name, cnt: cnt };
  $("delSubjMsg").textContent = "「" + name + "」下有 " + cnt + " 条笔记。";
  $("delSubjDlg").showModal();
}
function doDeleteSubject(i, migrate){
  const s = subjects[i];
  if(s == null) return;
  if(migrate){
    if(s !== "其他" && subjects.indexOf("其他") < 0) subjects.push("其他");
    notes.forEach(n => { if((n.subj || "") === s) n.subj = "其他"; });
    persist();
  }
  subjects.splice(i, 1);
  saveRaw(KEY_SUBJ, subjects);
  renderSubjDlg(); renderSubjBar(); renderPomoSubj(); renderChips(); renderList();

  else if(pendingDelSubj && pendingDelSubj.cnt) toast("已删除科目，笔记保留原标记（见「未分类」）");
  else toast("已删除科目");

}

/* ---------------- 分科统计 ---------------- */
/* 分科「本周 vs 上周」双条对比：上面一条本周（科目色），下面一条上周（灰底），
   右边给本周分钟数和涨跌幅 —— 直接回答「数学二是在涨还是在掉」。 */
function renderSubjStats(){
  const box = $("statSubj"); if(!box) return;
  const cur = subjMinutesKeys(weekDays(0)), prev = subjMinutesKeys(weekDays(-1));
  const all = {};
  Object.keys(cur).forEach(k => { all[k] = 1; });
  Object.keys(prev).forEach(k => { all[k] = 1; });
  const keys = Object.keys(all).filter(k => (cur[k] && cur[k].minutes) || (prev[k] && prev[k].minutes))
                   .sort((a, b) => ((cur[b] ? cur[b].minutes : 0) - (cur[a] ? cur[a].minutes : 0)));
  if(!keys.length){
    box.innerHTML = '<div class="stat-row"><span>本周还没有分科数据（番茄钟里选科目）</span><b>—</b></div>';
    return;
  }
  let max = 1;
  keys.forEach(k => {
    const cm = (cur[k] && cur[k].minutes) || 0, pm = (prev[k] && prev[k].minutes) || 0;
    if(cm > max) max = cm;
    if(pm > max) max = pm;
  });
  box.innerHTML = keys.map(k => {
    const cm = (cur[k] && cur[k].minutes) || 0, pm = (prev[k] && prev[k].minutes) || 0;
    const w1 = Math.max(2, Math.round(cm / max * 100)), w2 = Math.max(2, Math.round(pm / max * 100));
    return '<div class="cmp"><span class="cn">' + esc(k || "未分类") + "</span>" +
             '<span class="cbars">' +
               '<span class="cb"><i style="width:' + w1 + '%;background:' + subjColor(k) + '"></i></span>' +
               '<span class="cb p"><i style="width:' + w2 + '%"></i></span>' +
             "</span>" +
             '<span class="cv">' + cm + " 分<br>" + deltaHtml(pctDelta(cm, pm)) + "</span></div>";
  }).join("");
}

function mergePomoLog(incoming){
  if(!incoming || typeof incoming !== "object") return;
  /* 按「天」取两边最大值，而不是逐字段取 max：
     同一天在 A 设备做了 3 个、B 设备做了 2 个，逐字段合并得 3，互补的 2 个直接蒸发。
     取最大值虽然仍无法把「两边都连续在用、日期有重叠」的情况算准，
     但至少保证「同一天只有一个计数器在动」这个最常见场景结果正确，也绝不会把数据算少。 */
  for(const k in incoming){
    const a = pomoLog[k], b = incoming[k];
    if(!b || typeof b !== "object") continue;
    if(!a){ pomoLog[k] = b; continue; }
    const pickDay = a.count ? (b.count ? Math.max(a.count, b.count) : a.count) : (b.count || 0);
    let src;
    if(pickDay === (b.count || 0) && (b.count || 0) > (a.count || 0)) src = b; else src = a;
    const out = { count: pickDay,
                  minutes: pickDay === (b.count || 0) && (b.count || 0) > (a.count || 0)
                             ? (b.minutes || 0) : (a.minutes || 0),
                  subj: Object.assign({}, (src.subj || {})) };
    pomoLog[k] = out;
  }
  savePomoLog();
}
function importData(text){
  try{
    const data = JSON.parse(text);
    const arr = Array.isArray(data) ? data : (data.notes || []);
    /* 去重键：规范化文本（去空白）+ 日期到分钟。
       原来用完整毫秒 ISO 时间戳，跨设备永远不可能相同，等于没去重。 */
    const nk = (t, iso) => {
      const d = new Date(iso);
      const min = isNaN(d.getTime()) ? String(iso || "").slice(0, 16)
                                     : d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()) +
                                       " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
      return String(t || "").replace(/\s+/g, " ").trim() + "|" + min;
    };
    const have = new Set(notes.map(n => nk(n.text, n.createdAt)));
    const seenInFile = new Set();
    let added = 0, dup = 0;
    let addedS = 0;
    arr.forEach(x => {
      if(!x || typeof x.text !== "string") return;
      const createdAt = x.createdAt || new Date().toISOString();
      const key = nk(x.text, createdAt);
      if(have.has(key) || seenInFile.has(key)){ dup++; return; }   // 与现有记录、以及本次文件内重复的都跳过
      seenInFile.add(key);
      notes.push(normalizeNote({ id: null, text: x.text, tags: x.tags, subj: x.subj, createdAt, updatedAt: x.updatedAt,
                                 reviewAt: x.reviewAt, reviewStage: x.reviewStage, reviewLast: x.reviewLast }));
      have.add(key);
      added++;
    });
    if(!Array.isArray(data)){
      mergePomoLog(data.pomoLog);
      if(Array.isArray(data.subjects)){
        /* 与手动添加走同一套约束（24 字 / 60 个）：
           导入是数据进入内存的后门，之前只判断了「是字符串」，
           一份被改过的备份就能塞进超长科目名把科目条撑坏。 */
        data.subjects.forEach(s => {
          if(typeof s !== "string") return;
          const v = s.trim();
          if(!v || v.length > 24) return;
          if(subjects.length >= 60) return;
          if(subjects.indexOf(v) < 0) subjects.push(v);
        });
        saveRaw(KEY_SUBJ, subjects);
      }
      if(Array.isArray(data.goals) && data.goals.length){
        const haveG = new Set(goals.map(g => g.text));
        data.goals.forEach(g => {
          /* text 必须是非空字符串：notes 那条路径有同样的校验，这里漏了的话，
             对象类型的 text 会被原样存下来，界面上显示成 [object Object]。 */
          if(!g || typeof g.text !== "string") return;
          const t = g.text.trim();
          if(!t || t.length > 60 || haveG.has(t)) return;
          if(goals.length >= 30) return;
          haveG.add(t);
          goals.push({ id: uid(), text: t, subj: typeof g.subj === "string" ? g.subj : "" });
        });
        saveRaw(KEY_GOALS, goals);
      }
      if(data.goalLog && typeof data.goalLog === "object"){
        for(const k in data.goalLog){
          goalLog[k] = Object.assign({}, goalLog[k] || {}, data.goalLog[k] || {});
        }
        saveRaw(KEY_GOALLOG, goalLog);
      }
      if(data.exam && typeof data.exam.date === "string"){
        /* 日期必须形如 YYYY-MM-DD 才收，否则 examDaysLeft 会算出 null、
           而 renderExam 又会把乱码日期直接显示出来，用户以为导进来了其实是坏的 */
        const ed = data.exam.date.trim();
        if(/^\d{4}-\d{2}-\d{2}$/.test(ed) && !isNaN(new Date(ed + "T00:00:00").getTime())){
          exam = { name: typeof data.exam.name === "string" && data.exam.name ? data.exam.name : exam.name, date: ed };
          saveRaw(KEY_EXAM, exam);
          renderExam();
        }
      }
      addedS = mergeSessions(data.sessions);
      if(Array.isArray(data.recentTasks)){
        data.recentTasks.forEach(t => {
          if(typeof t === "string" && t && recentTasks.indexOf(t) < 0) recentTasks.push(t);
        });
        recentTasks = recentTasks.slice(0, 6);
        saveRaw(KEY_TASKS, recentTasks);
      }
    }
    persist();
    /* 两个受限列表都在导入里被限制了长度，但外部数据仍可能是「已有 59 条 + 导入 1 条」
       之外的越界情况；这里再削一刀，保证不变量始终成立。 */
    const MAX_SUBJ = 60, MAX_GOAL = 30, MAX_GOALTEXT = 60, MAX_SUBJCHARS = 24;
    if(subjects.length > MAX_SUBJ){ subjects = subjects.slice(0, MAX_SUBJ); saveRaw(KEY_SUBJ, subjects); }
    if(goals.length > MAX_GOAL){ goals = goals.slice(0, MAX_GOAL); saveRaw(KEY_GOALS, goals); }
    if(subjects.some(s => s.length > MAX_SUBJCHARS) || goals.some(g => g.text.length > MAX_GOALTEXT)){
      subjects = subjects.filter(s => s.length <= MAX_SUBJCHARS);
      goals = goals.filter(g => g.text.length <= MAX_GOALTEXT);
      saveRaw(KEY_SUBJ, subjects); saveRaw(KEY_GOALS, goals);
    }
    renderSubjBar(); renderPomoSubj(); render();
    toast("导入完成：新增 " + added + " 条" + (dup ? "，跳过 " + dup + " 条重复" : "") +
          (addedS ? "；日程 +" + addedS : ""));
  }catch(e){
    toast("导入失败：内容不是有效的备份 JSON");
  }
}

function schedToday(){
  const k = dayKey(new Date());
  const arr = sessions.filter(s => s.day === k);
  return { count: arr.length, minutes: arr.reduce((a, s) => a + (s.minutes || 0), 0) };
}
function schedAll(){
  /* 累计统计计入归档日程 */
  const all = sessions.concat(archivedSessions);
  return { count: all.length, minutes: all.reduce((a, s) => a + (s.minutes || 0), 0) };
}
function hhmm(iso){
  const d = new Date(iso);
  return isNaN(d.getTime()) ? "--:--" : pad(d.getHours()) + ":" + pad(d.getMinutes());
}
function renderSched(){
  if(!$("schedRows")) return;
  const t = schedToday(), all = schedAll();
  $("schedRows").innerHTML =
    '<div class="stat-row"><span>今日已完成</span><b>' + t.count + " 个 · " + fmtDur(t.minutes) + "</b></div>" +
    '<div class="stat-row"><span>累计已完成</span><b>' + all.count + " 个 · " + fmtDur(all.minutes) + "</b></div>";

  const box = $("schedList");
  if(!sessions.length){
    box.innerHTML = '<div class="sess"><div class="tk2">还没有完成的番茄。开一个番茄钟、给它起个名字，完成后这里会自动记下时间、时长和科目。</div></div>';
    return;
  }
  const byDay = {};
  sessions.forEach(s => {
    const k = s.day || dayKey(s.start || new Date());
    (byDay[k] = byDay[k] || []).push(s);
  });
  let html = "", shown = 0;
  const fmt = (iso) => { const d = new Date(iso); return isNaN(d.getTime()) ? 0 : d.getTime(); };
  Object.keys(byDay).sort().reverse().forEach(k => {
    if(shown >= 60) return;
    /* 同上：用时间戳排序。这两处原来还在用 localeCompare，跨设备导入的日程会排错 */
    const rows = byDay[k].sort((a, b) => fmt(b.start) - fmt(a.start));
    /* 标题上的「N 个」要按**实际渲染条数**算：
       截断发生在下面的循环里，用 rows.length 会让被截掉的那天虚报数量、
       和列表里实际看到的东西对不上。 */
    const cap = Math.min(rows.length, 60 - shown);
    html += '<div class="day">' + fmtDay(k) + " · " + cap + " 个" + (cap < rows.length ? "（本日仅显示最近 " + cap + " 条）" : "") + "</div>";
    rows.forEach(s => {
      if(shown >= 60) return;
      shown++;
      html += '<div class="sess"><div class="h">' +
              "<b>" + hhmm(s.start) + "–" + hhmm(s.end) + "</b>" +
              '<span class="du">' + (s.minutes || 0) + " 分钟</span>" +
              (s.subj ? '<span class="badge"><span class="dot" style="background:' + subjColor(s.subj) + '"></span>' + esc(s.subj) + "</span>" : "") +
              "</div>" +
              (s.task ? '<div class="tk2">' + esc(s.task) + "</div>" : "") +
              "</div>";
    });
  });
  if(shown < sessions.length) html += '<div class="chart-cap">只显示最近 60 条，共 ' + sessions.length + " 条</div>";
  if(archivedSessions.length) html += '<div class="chart-cap">另有 ' + archivedSessions.length + " 条较早记录已自动归档，导出备份包含全部</div>";
  box.innerHTML = html;
}
function schedText(){
  if(!sessions.length) return "还没有完成的学习记录。";
  const byDay = {};
  sessions.forEach(s => { const k = s.day || dayKey(s.start || new Date()); (byDay[k] = byDay[k] || []).push(s); });
  let out = "StudyBuddy 完成的学习日程\n";
  const fmt2 = (iso) => { const d = new Date(iso); return isNaN(d.getTime()) ? 0 : d.getTime(); };
  Object.keys(byDay).sort().reverse().forEach(k => {
    const rows = byDay[k].sort((a, b) => fmt2(a.start) - fmt2(b.start));
    const mins = rows.reduce((a, s) => a + (s.minutes || 0), 0);
    out += "\n【" + k + "】" + rows.length + " 个 · " + fmtDur(mins) + "\n";
    rows.forEach(s => {
      out += "  " + hhmm(s.start) + "-" + hhmm(s.end) + "  " + (s.minutes || 0) + " 分钟" +
             (s.subj ? "  " + s.subj : "") + (s.task ? "  " + s.task : "") + "\n";
    });
  });
  const a = schedAll();
  out += "\n合计：" + a.count + " 个 · " + fmtDur(a.minutes) + "\n";
  return out;
}

/* ---------------- 多标签页同步 ---------------- */
/* 其他标签页写入的数据实时同步过来，配合 persist() 的写前合并，把多标签覆盖丢数据的窗口压到毫秒级。
   注意：KEY_POMO / KEY_POMOLOG 不在列表内 —— 两个标签页各开一个番茄钟时，
   互相覆盖 endAt/running 会让计时错乱，番茄钟状态只属于「当前这个标签页」。 */
const SYNC_KEYS = [KEY_NOTES, KEY_SESS, KEY_SESS_ARC, KEY_TASKS, KEY_SUBJ, KEY_GOALS, KEY_GOALLOG, KEY_EXAM];
let reloadTimer = null;
let pendingReload = false;
window.addEventListener("storage", (e) => {
  if(!e.key || SYNC_KEYS.indexOf(e.key) < 0) return;
  clearTimeout(reloadTimer);
  reloadTimer = setTimeout(() => {
    /* 正在弹窗里操作时先不打断，关掉弹窗再补刷新 */
    if(document.querySelector("dialog[open]")){ pendingReload = true; return; }
    doReload();
  }, 150);
});
function doReload(){
  /* KEY_NOTES/日程等数据重新读入；番茄钟状态不参与同步，保持本页自己的进度 */
  load(); loadExtra();
  if(pomo.running && pomo.endAt && pomo.endAt - Date.now() <= 0) pomoFinish();   // 期间已经跑完就结算
  renderSubjBar(); renderPomoSubj(); renderExam();
  /* 跨标签页同步只换数据，不动用户的浏览位置：
     滚动容器是 main#list（它自己 overflow-y:auto，窗口根本不滚），
     所以要保的是 list.scrollTop，不是 window.scrollY。
     render() 会重建列表、把 scrollTop 打回 0，这里读旧值、渲染后写回去。 */
  const keepScroll = list.scrollTop;
  render();
  list.scrollTop = keepScroll;
  paintPomo(); syncPomoFull();
  renderGoals();                                          // 目标打卡数据可能来自另一个标签页
}

/* ---------------- 启动 ---------------- */
function boot(){
  initTheme();
  load();
  loadExtra();
  initPomo();
  initExtra();
  try{ const d = localStorage.getItem(KEY_DRAFT); if(d){ composer.value = d; send.disabled = false; } }catch(e){}
  render();
  const nb = daysSinceBackup();
  if(notes.length && (nb === null || nb >= 3)){
    setTimeout(() => toast("数据该备份了：⋯ → 复制备份到剪贴板"), 1200);
  }
  /* 弹窗关闭后补一次被搁置的跨标签页同步 */
  document.querySelectorAll("dialog").forEach(d => d.addEventListener("close", () => {
    if(pendingReload){ pendingReload = false; doReload(); }
  }));
  /* 回到前台时唤醒被挂起的音频，保证番茄提醒有声 */
  document.addEventListener("visibilitychange", () => {
    if(!document.hidden && audioCtx && audioCtx.state === "suspended"){
      audioCtx.resume().catch(() => {});
    }else if(document.hidden){
      flushDraft();          // 切后台前把防抖中的草稿立即落盘，避免丢字
    }
  });
  window.addEventListener("pagehide", flushDraft);
  initManifest();
  /* 单文件部署时 sw.js 常常不存在：先探测再注册，避免控制台 404 */
  if("serviceWorker" in navigator && location.protocol.startsWith("http")){
    fetch("sw.js", { method: "HEAD" })
      .then(r => { if(r.ok) return navigator.serviceWorker.register("sw.js"); })
      .catch(() => {});
  }
}
/* 用脚本拼出 manifest 并挂成 Blob URL：
   单文件分发时没有独立的 manifest 文件，外链只会 404；
   内联生成后「添加到主屏」即可拿到名字、图标与独立窗口模式。 */
function initManifest(){
