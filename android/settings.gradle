/* StudyBuddy Android 外壳 —— Gradle 设置
   只有 app 一个模块：一个 WebView 壳，把仓库根目录的 index.html 装进 assets 里跑。 */
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "StudyBuddy"
include ":app"
